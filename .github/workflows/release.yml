name: Build ISO (CD)

# Builds the distribution from source and publishes, per release:
#
#   core            seed -> stage1 -> stage2 -> stage3 -> rootfs (once, the slow part)
#                   publishes  mydistro-x86_64-rootfs.tar.zst  = the SEED of the next build
#   build (matrix)  runs in parallel on the finished core, one runner each:
#                     iso-nogui   mydistro-x86_64.iso
#                     iso-gui     mydistro-gui-x86_64.iso   (adds recipes/gui on top of core)
#                     rootfs-min  mydistro-x86_64-rootfs-min.tar.zst  (base-devel + nawa only)
#   boot-test       boots each ISO in QEMU, waits for the login prompt (gates the release)
#   image           rootfs-min -> ghcr.io/<owner>/mydistro-build (container build environment)
#   release         one GitHub Release with everything above (tags only)
#   report          always last: ONE page (run summary + `run-report` artifact) with the
#                   verdict, every job and its time, the failed step, the error lines
#                   of the failing log and the artifacts (scripts/ci-report.py)
#
# Why a pipeline and not a plain matrix over "gui: [false, true]": the GUI
# stack is only extra packages on top of the same system, so a matrix over
# the whole build would compile gcc/glibc/rust/linux twice. The matrix is
# over what is DERIVED from the core.
#
#   * push a tag `v*`         -> everything, then a GitHub Release
#   * Actions > Run workflow  -> artifacts only (pick what to build in `outputs`)
#
# Self-hosting: each run builds with the rootfs of the newest release that
# carries one (scripts/fetch-rootfs-seed.sh) instead of the Debian-based seed.
#
# The recipes are NOT in this repository: they live in faseela-repo. The first
# job resolves the commit of its default branch (or the `recipes_ref` you give)
# once, every job fetches exactly that commit (bootstrap/fetch-recipes.sh), and
# the release notes name it, so a release can be rebuilt from the same recipes.
#
# Hosted runners stop a job after 6 hours and the core is the long job, so
# every dispatch run saves the build target to the Actions cache and the next
# dispatch run with `resume` continues from it. The core hands its finished
# target to the matrix jobs as a one-day workflow artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      outputs:
        description: "What to build on top of the core system"
        type: choice
        options: [all, iso-nogui, iso-gui, rootfs-min]
        default: all
      isolation:
        description: "Build isolation for stages 2 and 3"
        type: choice
        options: [env, sandbox, closure, none]
        default: sandbox
      stage3_world:
        description: "Rebuild every package in stage 3"
        type: boolean
        default: true
      resume:
        description: "Resume from the cached build target of the previous run (uncheck for a clean start)"
        type: boolean
        default: false
      seed:
        description: "Build seed: auto = previous release's rootfs if there is one, else Debian; rootfs = require it; debian = always start from the Debian seed"
        type: choice
        options: [auto, rootfs, debian]
        default: auto
      push_image:
        description: "Also publish rootfs-min as a container image (tags do this anyway)"
        type: boolean
        default: true
      recipes_ref:
        description: "faseela-repo branch, tag or commit to build the recipes from (empty = its default branch)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET: /mnt/mydistro
  ROOTFS_ASSET: mydistro-x86_64-rootfs.tar.zst

jobs:
  # The ONE place that decides which faseela-repo commit this whole run builds:
  # a branch that moves while the run is going must not split it in two.
  recipes:
    name: recipes revision
    runs-on: ubuntu-24.04
    outputs:
      rev: ${{ steps.r.outputs.rev }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          RECIPES_REF: ${{ inputs.recipes_ref }}
        run: |
          set -euo pipefail
          rev="$(bash bootstrap/fetch-recipes.sh --resolve)"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "### Recipes: faseela-repo@$rev" >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: recipes
    uses: ./.github/workflows/ci.yml
    with:
      recipes_ref: ${{ needs.recipes.outputs.rev }}

  # Turns the `outputs` choice into the build matrix (tag pushes: everything).
  plan:
    name: plan
    needs: [recipes, ci]
    runs-on: ubuntu-24.04
    outputs:
      recipes_rev: ${{ needs.recipes.outputs.rev }}
      matrix: ${{ steps.m.outputs.matrix }}
      isos: ${{ steps.m.outputs.isos }}
      has_iso: ${{ steps.m.outputs.has_iso }}
    steps:
      - id: m
        env:
          ONLY: ${{ inputs.outputs || 'all' }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          only = os.environ["ONLY"]
          variants = [
              {"variant": "iso-nogui", "kind": "iso", "gui": "0",
               "iso": "mydistro-x86_64.iso", "vol": "MYDISTRO"},
              {"variant": "iso-gui", "kind": "iso", "gui": "1",
               "iso": "mydistro-gui-x86_64.iso", "vol": "MYDISTRO_GUI"},
              {"variant": "rootfs-min", "kind": "rootfs", "gui": "0"},
          ]
          sel = [v for v in variants if only in ("all", v["variant"])]
          print("matrix=" + json.dumps({"include": sel}))
          isos = [v for v in sel if v["kind"] == "iso"]
          print("isos=" + json.dumps({"include": isos}))
          print("has_iso=" + ("true" if isos else "false"))
          PY

  core:
    name: core (seed → stage3 → rootfs)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      seed: ${{ steps.rootfsseed.outputs.path != '' && 'the previous release rootfs (self-hosting)' || 'the Debian-based bootstrap seed' }}
    env:
      ISOLATION: ${{ inputs.isolation || 'env' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the recipes (faseela-repo @ the commit chosen by this run)
        env:
          RECIPES_REF: ${{ needs.plan.outputs.recipes_rev }}
        run: bash bootstrap/fetch-recipes.sh

      # Seed selection, BEFORE the Debian-seed cache so a rootfs seed does not
      # restore (and later save) a ~330 MB seed it will not use. The download
      # is verified against the release's .sha256 inside the script; a
      # mismatch or a gh failure fails the job (never a silent fallback to a
      # different seed).
      - name: Choose the seed (previous release's rootfs, else Debian)
        id: rootfsseed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SEED_MODE: ${{ inputs.seed || 'auto' }}
        run: |
          if [[ "$SEED_MODE" == debian ]]; then
            echo "seed: Debian (requested)"
            echo "### Seed: Debian-based (requested)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rc=0
          path="$(bash scripts/fetch-rootfs-seed.sh "$RUNNER_TEMP/rootfs-seed")" || rc=$?
          case "$rc" in
            0)
              # A rootfs is only a usable seed if it can compile: the gcc
              # driver alone is not enough (stage1 dies on "cannot execute
              # 'cc1'"). Check the archive listing before committing to it.
              listing="$(zstd -dc "$path" | tar -t 2>/dev/null || true)"
              if grep -qE '/libexec/gcc/[^/]+/[^/]+/cc1$' <<< "$listing" \
                 && grep -qE '/libexec/gcc/[^/]+/[^/]+/cc1plus$' <<< "$listing"; then
                echo "path=$path" >> "$GITHUB_OUTPUT"
                echo "### Seed: previous release's rootfs (self-hosting)" >> "$GITHUB_STEP_SUMMARY"
                echo "sha256: $(cut -d' ' -f1 "$path.sha256")" >> "$GITHUB_STEP_SUMMARY"
              elif [[ "$SEED_MODE" == rootfs ]]; then
                echo "::error::the previous release's rootfs has no gcc cc1/cc1plus - it cannot seed a build"
                exit 1
              else
                echo "::warning::the previous release's rootfs has no gcc cc1/cc1plus (unusable seed) - falling back to the Debian seed"
                echo "### Seed: Debian-based (previous rootfs is broken: no cc1/cc1plus)" >> "$GITHUB_STEP_SUMMARY"
                rm -f "$path" "$path.sha256"
              fi ;;
            3)
              if [[ "$SEED_MODE" == rootfs ]]; then
                echo "::error::seed=rootfs, but no release carries $ROOTFS_ASSET"
                exit 1
              fi
              echo "::notice::no published rootfs yet - bootstrapping from the Debian seed"
              echo "### Seed: Debian-based (no release carries a rootfs yet)" >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "::error::could not fetch/verify the rootfs seed (fetch-rootfs-seed.sh exit $rc)"
              exit "$rc" ;;
          esac

      # The hosted runner already has ~100 GB free; removing dotnet/android/ghc
      # cost ~52 s per run. Opt in with the repository variable FREE_DISK=true.
      - name: Free disk space (opt-in)
        if: ${{ vars.FREE_DISK == 'true' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h / /mnt

      # The Debian seed (~330 MB) only changes when its builder does. Restore
      # here, save AFTER the build with `always()`: a plain actions/cache step
      # saves only when the job succeeds, so a failed run lost the seed while
      # the target cache (whose stamps say "seed done") survived.
      - name: Restore the bootstrap seed
        id: seedcache
        if: ${{ steps.rootfsseed.outputs.path == '' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            bootstrap/seed/seed.tar.zst
            bootstrap/seed/seed.tar.zst.sha256
          key: seed-${{ runner.os }}-${{ hashFiles('bootstrap/seed/build-seed.sh', 'bootstrap/seed/seed.toml') }}

      # Resume = restore the whole build target (/mnt/mydistro + its state dir)
      # saved by the previous dispatch run, even if that run failed or timed
      # out. Stage 2 skips packages that are already installed. A fresh tag
      # build is always clean; only "Re-run failed jobs" of a tag run
      # (run_attempt > 1) resumes from what the failed attempt saved.
      - name: Restore the previous build target
        id: tgtcache
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.resume) || (github.event_name == 'push' && github.run_attempt > 1) }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/target.tar.zst
          key: iso-target-${{ runner.os }}-never-matches
          restore-keys: |
            iso-target-${{ runner.os }}-

      - name: Unpack the previous build target
        if: ${{ steps.tgtcache.outputs.cache-matched-key != '' }}
        run: |
          ls -lh "$RUNNER_TEMP/target.tar.zst"
          sudo tar -I zstd -xpf "$RUNNER_TEMP/target.tar.zst" -C /mnt --numeric-owner
          rm -f "$RUNNER_TEMP/target.tar.zst"
          ls /mnt

      # Package cache: the archives (+ .buildid sidecars) of every package the
      # previous runs built. stage2 reuses an archive whose build_id still
      # matches (nawa build --use-cache), so a rerun after a one-recipe fix
      # rebuilds that recipe, not gcc + linux + cmake again. The key carries a
      # hash of the toolchain recipes, profiles and stage scripts: touching
      # glibc/gcc/binutils/the profile drops the whole cache (build_id does not
      # cover dependencies' versions at stage-2 isolation levels). Set the
      # repository variable PKGCACHE=false to build everything from scratch.
      - name: Restore the package cache
        id: pkgcache
        if: ${{ vars.PKGCACHE != 'false' && steps.tgtcache.outputs.cache-matched-key == '' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/pkgcache
          key: pkgs-${{ hashFiles('recipes/toolchain/**', 'profiles/**', 'bootstrap/stage2-inner.sh') }}-never-matches
          restore-keys: |
            pkgs-${{ hashFiles('recipes/toolchain/**', 'profiles/**', 'bootstrap/stage2-inner.sh') }}-

      - name: Place the cached archives in the build target
        if: ${{ steps.pkgcache.outputs.cache-matched-key != '' }}
        run: |
          sudo mkdir -p "$TARGET/build/out"
          sudo cp -a "$RUNNER_TEMP/pkgcache/." "$TARGET/build/out/"
          ls "$TARGET/build/out" | wc -l

      # No ISO host tools here: the ISOs are made by the matrix jobs.
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc make curl zstd ca-certificates util-linux

      - name: Allow unprivileged user namespaces, disable core dumps
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # a crash loop must not spend ~1 s per crash writing cores
          sudo sysctl -w kernel.core_pattern='|/bin/false' || true

      # Minutes, not hours: an unreachable source host fails here instead of
      # at package 102 of stage 2. Needs only python3 (preinstalled).
      - name: Check that every recipe source is reachable
        run: python3 scripts/check-sources.py

      - name: Build the core (seed -> stage1 -> stage2 -> stage3 -> rootfs)
        id: build
        timeout-minutes: 320 # leaves ~35 min of the 355 for saving the cache and logs
        env:
          ROOTFS_SEED: ${{ steps.rootfsseed.outputs.path }}
          STAGE3_WORLD: ${{ inputs.stage3_world }}
          STAGE2_USE_CACHE: ${{ vars.PKGCACHE != 'false' && '1' || '0' }}
        run: |
          args=(--isolation "$ISOLATION" --no-iso
                --rootfs-out "$GITHUB_WORKSPACE/out/$ROOTFS_ASSET")
          [[ "$STAGE3_WORLD" == "true" ]] && args+=(--stage3-world)
          # self-hosting: the previous release's rootfs replaces the Debian seed
          [[ -n "$ROOTFS_SEED" ]]         && args+=(--seed-rootfs "$ROOTFS_SEED")
          sudo -E ./bootstrap/build-all.sh "${args[@]}" "$TARGET"

      - name: Save the bootstrap seed (also on failure)
        if: ${{ always() && steps.seedcache.outputs.cache-hit != 'true' && hashFiles('bootstrap/seed/seed.tar.zst') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            bootstrap/seed/seed.tar.zst
            bootstrap/seed/seed.tar.zst.sha256
          key: seed-${{ runner.os }}-${{ hashFiles('bootstrap/seed/build-seed.sh', 'bootstrap/seed/seed.toml') }}

      # One tarball, two uses: the resume cache of the next dispatch run, and
      # the hand-over to the matrix jobs. Packed after a failure only when a
      # dispatch run may resume from it.
      - name: Pack the build target
        id: packtgt
        if: ${{ always() && steps.build.conclusion != 'skipped' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.build.outcome == 'success') }}
        continue-on-error: true
        run: |
          sudo ./bootstrap/umount-chroot.sh "$TARGET" || true
          sudo tar -I 'zstd -T0 -3' --one-file-system -cpf "$RUNNER_TEMP/target.tar.zst" --numeric-owner \
            --exclude='mydistro/build/*/src' --exclude='mydistro/build/*/pkg' \
            -C /mnt mydistro .mydistro.build
          ls -lh "$RUNNER_TEMP/target.tar.zst"

      - name: Pack the package cache
        id: packpkgs
        if: ${{ always() && vars.PKGCACHE != 'false' && steps.build.conclusion != 'skipped' }}
        continue-on-error: true
        run: |
          rm -rf "$RUNNER_TEMP/pkgcache" && mkdir -p "$RUNNER_TEMP/pkgcache"
          sudo cp -a "$TARGET/build/out/." "$RUNNER_TEMP/pkgcache/"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/pkgcache"
          du -sh "$RUNNER_TEMP/pkgcache"; ls "$RUNNER_TEMP/pkgcache" | wc -l

      - name: Save the package cache
        if: ${{ always() && steps.packpkgs.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pkgcache
          key: pkgs-${{ hashFiles('recipes/toolchain/**', 'profiles/**', 'bootstrap/stage2-inner.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the build target cache (resume)
        if: ${{ always() && steps.packtgt.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/target.tar.zst
          key: iso-target-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Checksums
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          # build-all.sh runs under sudo: out/ is root-owned
          sudo chown -R "$(id -u):$(id -g)" out
          cd out
          # the rootfs checksum was written by mkrootfs.sh; re-verify it here,
          # because the NEXT build trusts exactly this file as its seed
          sha256sum -c "$ROOTFS_ASSET.sha256"
          {
            echo "### Core rootfs"
            echo "| | |"; echo "|---|---|"
            echo "| file | \`$ROOTFS_ASSET\` ($(du -h "$ROOTFS_ASSET" | cut -f1)) |"
            echo "| sha256 | \`$(cut -d' ' -f1 "$ROOTFS_ASSET.sha256")\` |"
            [[ -f mydistro-x86_64-rootfs.packages ]] && echo "| packages | $(wc -l < mydistro-x86_64-rootfs.packages) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the core target for the matrix jobs
        if: ${{ steps.build.outcome == 'success' && steps.packtgt.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: core-target
          path: ${{ runner.temp }}/target.tar.zst
          retention-days: 1
          compression-level: 0

      - name: Upload the rootfs (the seed of the next build)
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: out-rootfs
          path: |
            out/mydistro-x86_64-rootfs.tar.zst
            out/mydistro-x86_64-rootfs.tar.zst.sha256
            out/mydistro-x86_64-rootfs.packages
          retention-days: 14
          compression-level: 0

      - name: Collect build logs
        if: always()
        run: |
          mkdir -p ci-logs
          sudo cp -r /mnt/.mydistro.build/logs ci-logs/ 2>/dev/null || true
          sudo cp /mnt/.mydistro.build/meta ci-logs/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" ci-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-core
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

      # Why it failed, without opening a 60 MB log: the stage that died, the
      # ERROR lines before it and the last lines. Shown in this job's summary
      # and repeated by the final `run report` job.
      - name: Failure excerpt
        if: ${{ always() && steps.build.conclusion != 'skipped' }}
        continue-on-error: true
        run: |
          mkdir -p report
          log="$(find ci-logs/logs -name 'build-*.log' -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-)"
          if [[ -n "$log" ]]; then
            python3 scripts/ci-report.py excerpt "$log" --title "core" | tee report/core.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-core
          path: report
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------- matrix
  build:
    name: ${{ matrix.variant }}
    needs: [plan, core]
    runs-on: ubuntu-24.04
    # iso-gui compiles the whole GUI stack (stage 2 with recipes/gui)
    timeout-minutes: ${{ matrix.gui == '1' && 340 || 90 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ISOLATION: ${{ inputs.isolation || 'env' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the recipes (faseela-repo @ the commit chosen by this run)
        env:
          RECIPES_REF: ${{ needs.plan.outputs.recipes_rev }}
        run: bash bootstrap/fetch-recipes.sh

      - uses: actions/download-artifact@v4
        with:
          name: core-target
          path: ${{ runner.temp }}/core

      - name: Unpack the core target
        run: |
          sudo tar -I zstd -xpf "$RUNNER_TEMP/core/target.tar.zst" -C /mnt --numeric-owner
          rm -rf "$RUNNER_TEMP/core"
          df -h /mnt

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools \
            gcc make curl zstd ca-certificates util-linux python3

      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.core_pattern='|/bin/false' || true

      # The GUI stack is installed into the same two-root layout as the core
      # (build root + clean /sysroot). stage 2 skips every package the core
      # already installed, so only recipes/gui is compiled. Re-running stage 2
      # after stage 3 is supported (stage2.sh keeps the installed nawa).
      - name: Build the GUI stack on top of the core
        if: ${{ matrix.gui == '1' }}
        run: |
          # stage 2 never uses `closure` (that level is stage 3 only)
          iso="$ISOLATION"; [[ "$iso" == closure ]] && iso=sandbox
          sudo env WITH_GUI=1 NAWA_JOBS="$(nproc)" STAGE2_ISOLATION="$iso" \
            bash bootstrap/stage2.sh "$TARGET"

      - name: Make the ISO
        if: ${{ matrix.kind == 'iso' }}
        env:
          ISO_NAME: ${{ matrix.iso }}
          VOL_ID: ${{ matrix.vol }}
        run: |
          mkdir -p out
          sudo env VOL_ID="$VOL_ID" NAWA_JOBS="$(nproc)" \
            bash bootstrap/mkiso.sh "$TARGET/sysroot" "$PWD/out/$ISO_NAME"
          sudo chown -R "$(id -u):$(id -g)" out
          cd out
          sha256sum "$ISO_NAME" | tee "$ISO_NAME.sha256"
          ls -lh .
          echo "### ${{ matrix.variant }}: \`$ISO_NAME\` ($(du -h "$ISO_NAME" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Make the small base-devel rootfs
        if: ${{ matrix.kind == 'rootfs' }}
        run: |
          mkdir -p out
          sudo bash bootstrap/mkrootfs-min.sh "$TARGET" "$PWD/out/mydistro-x86_64-rootfs-min.tar.zst"
          sudo chown -R "$(id -u):$(id -g)" out
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.variant }}
          path: out/*
          retention-days: 14
          compression-level: 0

      - name: Collect build logs
        if: always()
        run: |
          mkdir -p ci-logs
          sudo cp -r /mnt/.mydistro.build/logs ci-logs/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" ci-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ matrix.variant }}
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Failure excerpt
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          mkdir -p report
          log="$(find ci-logs/logs -name 'build-*.log' -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-)"
          if [[ -n "$log" ]]; then
            python3 scripts/ci-report.py excerpt "$log" --title "${{ matrix.variant }}" \
              | tee "report/${{ matrix.variant }}.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: report-${{ matrix.variant }}
          path: report
          if-no-files-found: ignore
          retention-days: 14

  # Boots every ISO in QEMU (BIOS, through grub) and waits for the login
  # prompt on the serial console (scripts/qemu-boot-test.sh). On a tag this
  # gates the release: an ISO that does not boot is never published.
  boot-test:
    name: boot ${{ matrix.variant }} in QEMU
    needs: [plan, build]
    if: ${{ needs.plan.outputs.has_iso == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.isos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: out-${{ matrix.variant }}
          path: iso
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 socat
          # hosted Linux runners expose /dev/kvm, but only root may use it
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true
      - name: Verify the ISO checksum
        env:
          ISO_NAME: ${{ matrix.iso }}
        run: cd iso && sha256sum -c "$ISO_NAME.sha256"
      - name: Boot it and wait for the login prompt
        env:
          ISO_NAME: ${{ matrix.iso }}
        run: bash scripts/qemu-boot-test.sh "iso/$ISO_NAME" qemu-boot
      - name: Serial console tail
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          mkdir -p report
          {
            echo "### ❌ boot ${{ matrix.variant }}: no login prompt"
            echo; echo "<details open><summary>Last serial console lines</summary>"; echo; echo '```'
            tail -n 40 qemu-boot/serial.log 2>/dev/null | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' || echo "(no serial log)"
            echo '```'; echo; echo "</details>"
          } | tee "report/boot-${{ matrix.variant }}.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: report-boot-${{ matrix.variant }}
          path: report
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-boot-${{ matrix.variant }}
          path: qemu-boot
          if-no-files-found: ignore
          retention-days: 14

  # The small rootfs as a container image: the environment packages.yml (in faseela-repo) and
  # anyone else can build in (`docker run ghcr.io/<owner>/mydistro-build`).
  image:
    name: container image (rootfs-min → ghcr.io)
    needs: build
    if: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.push_image) && (inputs.outputs == '' || inputs.outputs == 'all' || inputs.outputs == 'rootfs-min') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: out-rootfs-min
          path: rootfs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Import and push
        run: |
          set -euo pipefail
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mydistro-build"
          tag="${GITHUB_REF_NAME//\//-}"
          cd rootfs
          sha256sum -c mydistro-x86_64-rootfs-min.tar.zst.sha256
          zstd -dc mydistro-x86_64-rootfs-min.tar.zst \
            | docker import \
                --change 'ENV PATH=/usr/sbin:/usr/bin:/sbin:/bin' \
                --change 'CMD ["/usr/bin/bash"]' \
                - "$img:$tag"
          docker tag "$img:$tag" "$img:latest"
          docker push "$img:$tag"
          docker push "$img:latest"

  release:
    name: GitHub Release
    needs: [plan, core, build, boot-test]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ needs.core.outputs.seed }}
          RECIPES_REV: ${{ needs.plan.outputs.recipes_rev }}
        run: |
          set -euo pipefail
          ls -lh artifacts
          # A release asset is limited to 2 GiB. Bigger files stay workflow
          # artifacts and the release carries only the checksum files. The
          # rootfs and its .sha256 are what the NEXT build downloads as its
          # seed (scripts/fetch-rootfs-seed.sh).
          files=()
          for f in artifacts/*; do
            size=$(stat -c %s "$f")
            case "$f" in *.sha256|*.packages) ;; *)
              if (( size >= 2147483648 )); then
                echo "::warning::$f is $size bytes (>= 2 GiB): left as a workflow artifact"
                continue
              fi ;;
            esac
            files+=("$f")
          done
          cat > notes.md <<NOTES
          | file | what |
          |---|---|
          | \`mydistro-x86_64.iso\` | live ISO, no GUI |
          | \`mydistro-gui-x86_64.iso\` | live ISO with the sway/Wayland stack |
          | \`mydistro-x86_64-rootfs-min.tar.zst\` | small rootfs: base-devel + nawa (build environment, also \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mydistro-build\`) |
          | \`mydistro-x86_64-rootfs.tar.zst\` | full rootfs incl. rust: the seed of the next build (\`build-all.sh --seed-rootfs\`) |

          This release was built from: ${SEED}.

          Recipes: [faseela-repo@${RECIPES_REV:0:12}](https://github.com/mrdevmohamed/faseela-repo/tree/${RECIPES_REV}).
          To rebuild this release from the same recipes, run *Build ISO (CD)* with \`recipes_ref\` = \`${RECIPES_REV}\`.
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --generate-notes --notes-file notes.md "${files[@]}"

  # Always runs, last, whatever happened (also on failure and cancel): one page
  # that says what happened, so nobody has to open the jobs one by one.
  # Written to the run summary and kept as the `run-report` artifact.
  report:
    name: run report
    if: ${{ always() }}
    needs: [recipes, ci, plan, core, build, boot-test, image, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read   # list this run's jobs and artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true   # none exist when nothing failed
        with:
          pattern: report-*
          path: report-parts
          merge-multiple: true
      - name: Write the report
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RECIPES_REV: ${{ needs.plan.outputs.recipes_rev || needs.recipes.outputs.rev }}
          SEED: ${{ needs.core.outputs.seed }}
          ISOLATION: ${{ inputs.isolation || 'env' }}
          OUTPUTS: ${{ inputs.outputs || 'all' }}
        run: |
          printf '%s' "$NEEDS" > needs.json
          facts=(--fact "Outputs=$OUTPUTS" --fact "Isolation=$ISOLATION")
          [[ -n "$RECIPES_REV" ]] && facts+=(--fact "Recipes=[faseela-repo@${RECIPES_REV:0:12}](https://github.com/mrdevmohamed/faseela-repo/tree/$RECIPES_REV)")
          [[ -n "$SEED" ]]        && facts+=(--fact "Seed=$SEED")
          python3 scripts/ci-report.py report --needs-json needs.json --extra report-parts "${facts[@]}" \
            | tee run-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: run-report.md
          retention-days: 30
