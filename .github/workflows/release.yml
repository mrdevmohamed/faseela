name: Build ISO (CD)

# Builds the whole distribution from source and publishes the bootable ISO.
#   * push a tag `v*`            -> build + GitHub Release with the ISO
#   * Actions > Run workflow     -> build + downloadable artifact only
#
# A full source build is long. GitHub-hosted runners stop a job after 6 hours
# and have limited disk, so for a complete build set the repository variable
# ISO_RUNNER to the label of a self-hosted runner (Linux x86_64, root/sudo,
# >= 30 GB free). The default is the hosted ubuntu-24.04 runner.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      isolation:
        description: "Build isolation for stages 2 and 3"
        type: choice
        options: [env, sandbox, closure, none]
        default: env
      with_gui:
        description: "Also build the sway/Wayland stack (recipes/gui)"
        type: boolean
        default: false
      stage3_world:
        description: "Rebuild every package in stage 3"
        type: boolean
        default: false
      resume:
        description: "Resume from the cached build target of the previous run (uncheck for a clean start)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  iso:
    name: build the ISO
    needs: ci
    runs-on: ${{ vars.ISO_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 355
    permissions:
      contents: write # create the GitHub Release
    env:
      TARGET: /mnt/mydistro
      ISOLATION: ${{ inputs.isolation || 'env' }}
    steps:
      - uses: actions/checkout@v4

      # The hosted runner already has ~100 GB free; removing dotnet/android/ghc
      # cost ~52 s per run. Opt in with the repository variable FREE_DISK=true.
      - name: Free disk space (opt-in)
        if: ${{ vars.FREE_DISK == 'true' && vars.ISO_RUNNER == '' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h / /mnt

      # The seed (~330 MB, ~1 min to assemble from Debian packages) only
      # changes when its builder does. Restored with its mtime, because
      # build-all.sh fingerprints the seed by size+mtime.
      # Restore here, save AFTER the build with `always()`: a plain
      # actions/cache step saves only when the job succeeds, so a failed run
      # lost the seed while the target cache (whose stamps say "seed done")
      # survived -> the next resume died with "stage1: seed missing".
      - name: Restore the bootstrap seed
        id: seedcache
        uses: actions/cache/restore@v4
        with:
          path: |
            bootstrap/seed/seed.tar.zst
            bootstrap/seed/seed.tar.zst.sha256
          key: seed-${{ runner.os }}-${{ hashFiles('bootstrap/seed/build-seed.sh', 'bootstrap/seed/seed.toml') }}

      # Resume = restore the whole build target (/mnt/mydistro + its state dir)
      # saved by the previous dispatch run, even if that run failed or timed
      # out. Stage 2 skips packages that are already installed, so a re-run
      # continues where the last one stopped. Tag (release) builds are always
      # clean.
      - name: Restore the previous build target
        id: tgtcache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/target.tar.zst
          key: iso-target-${{ runner.os }}-never-matches
          restore-keys: |
            iso-target-${{ runner.os }}-

      - name: Unpack the previous build target
        if: ${{ steps.tgtcache.outputs.cache-matched-key != '' }}
        run: |
          ls -lh "$RUNNER_TEMP/target.tar.zst"
          sudo tar -I zstd -xpf "$RUNNER_TEMP/target.tar.zst" -C /mnt --numeric-owner
          rm -f "$RUNNER_TEMP/target.tar.zst"
          ls /mnt

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools \
            gcc make curl zstd ca-certificates util-linux

      - name: Allow unprivileged user namespaces, disable core dumps
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # a crash loop (3000+ aborts in the failed run) must not spend ~1 s
          # per crash writing cores
          sudo sysctl -w kernel.core_pattern='|/bin/false' || true

      - name: Build the distribution (seed -> stage1 -> stage2 -> stage3 -> ISO)
        id: build
        timeout-minutes: 320 # leaves ~35 min of the 355 for saving the cache and logs
        run: |
          args=(--isolation "$ISOLATION" --out "$GITHUB_WORKSPACE/out/mydistro-x86_64.iso")
          [[ "${{ inputs.with_gui }}" == "true" ]]     && args+=(--with-gui)
          [[ "${{ inputs.stage3_world }}" == "true" ]] && args+=(--stage3-world)
          sudo -E ./bootstrap/build-all.sh "${args[@]}" "$TARGET"

      - name: Save the bootstrap seed (also on failure)
        if: ${{ always() && steps.seedcache.outputs.cache-hit != 'true' && hashFiles('bootstrap/seed/seed.tar.zst') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            bootstrap/seed/seed.tar.zst
            bootstrap/seed/seed.tar.zst.sha256
          key: seed-${{ runner.os }}-${{ hashFiles('bootstrap/seed/build-seed.sh', 'bootstrap/seed/seed.toml') }}

      - name: Pack the build target for the next run
        id: packtgt
        if: ${{ always() && github.event_name == 'workflow_dispatch' && steps.build.conclusion != 'skipped' }}
        continue-on-error: true
        run: |
          sudo ./bootstrap/umount-chroot.sh "$TARGET" || true
          sudo tar -I 'zstd -T0 -3' --one-file-system -cpf "$RUNNER_TEMP/target.tar.zst" --numeric-owner \
            --exclude='mydistro/build/*/src' --exclude='mydistro/build/*/pkg' \
            -C /mnt mydistro .mydistro.build
          ls -lh "$RUNNER_TEMP/target.tar.zst"

      - name: Save the build target cache
        if: ${{ always() && steps.packtgt.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/target.tar.zst
          key: iso-target-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Checksums
        id: sum
        run: |
          cd out
          sha256sum mydistro-x86_64.iso | tee mydistro-x86_64.iso.sha256
          echo "size=$(stat -c %s mydistro-x86_64.iso)" >> "$GITHUB_OUTPUT"

      - name: Upload the ISO as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mydistro-x86_64-iso
          path: |
            out/mydistro-x86_64.iso
            out/mydistro-x86_64.iso.sha256
          retention-days: 14
          compression-level: 0

      - name: Upload build logs (also on failure)
        if: always()
        run: |
          mkdir -p ci-logs
          sudo cp -r /mnt/.mydistro.build/logs ci-logs/ 2>/dev/null || true
          sudo cp /mnt/.mydistro.build/meta ci-logs/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" ci-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

      # A release asset is limited to 2 GiB. Bigger ISOs stay as the artifact
      # above and the release carries only the checksum file.
      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/mydistro-x86_64.iso.sha256
            ${{ steps.sum.outputs.size < 2147483648 && 'out/mydistro-x86_64.iso' || '' }}
