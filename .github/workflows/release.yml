name: Build ISO (CD)

# Builds the distribution and publishes, per release. By default NOTHING IS
# COMPILED here: faseela-repo (packages.yml) builds every package once, and this
# workflow only installs them (core_mode=repo / auto). core_mode=build compiles
# the bootstrap core instead (hours) — needed once to start, or to prove it
# still builds itself.
#
#   core            core_mode=repo: the previous release's rootfs + the `seed` flavor
#                   installed from the package repository (minutes)
#                   core_mode=build: seed -> stage1 -> stage2 -> stage3 -> rootfs: builds ONLY the
#                   bootstrap flavor (flavors.toml: base-devel, nawa, curl and what
#                   builds them), with the seed toolchain and then again with its own
#                   publishes  faseela-x86_64-rootfs.tar.zst  = the SEED of the next build
#   build (matrix)  one runner per selected flavor, discovered from flavors.toml.
#                   Names beginning iso- become ISOs; names beginning rootfs-
#                   become rootfs archives. New flavors need no release.yml edits.
#                   Other flavors can be selected explicitly and become rootfs archives.
#   boot-test       boots each ISO in QEMU, waits for the login prompt (gates the release)
#   release         one GitHub Release with everything above (tags only)
#   report          always last: ONE page (run summary + `run-report` artifact) with the
#                   verdict, every job and its time, the failed step, the error lines
#                   of the failing log and the artifacts (scripts/ci-report.py)
#
# Why a pipeline and not a matrix over the whole build: every package is built
# The planner reads flavors.toml from the exact faseela-repo commit selected by
# this run. "all" discovers every iso-* and rootfs-* flavor automatically.
# Before a release, packages.yml must publish those flavors' package archives;
# the plan job warns when anything is missing, and the affected flavor names the
# missing packages rather than silently compiling them.
#
#   * push a tag `v*`         -> everything, then a GitHub Release
#   * Actions > Run workflow  -> artifacts only (pick what to build in `outputs`)
#
# Self-hosting: each run builds with the rootfs of the newest release that
# carries one (scripts/fetch-rootfs-seed.sh) instead of the Debian-based seed.
#
# The recipes are NOT in this repository: they live in faseela-repo. The first
# job resolves the commit of its default branch (or the `recipes_ref` you give)
# once, every job fetches exactly that commit (bootstrap/fetch-recipes.sh), and
# the release notes name it, so a release can be rebuilt from the same recipes.
#
# Hosted runners stop a job after 6 hours and the core is the long job, so
# every dispatch run saves the build target to the Actions cache and the next
# dispatch run with `resume` continues from it. The core hands its finished
# target to the matrix jobs as a three-day workflow artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      outputs:
        description: "all = auto-discover every iso-* and rootfs-* flavor; core = only the bootstrap seed; or enter one or more exact flavor names (e.g. iso-xfce iso-sway)"
        type: string
        default: "all"
      isolation:
        description: "Build isolation for stages 2 and 3"
        type: choice
        options: [env, sandbox, closure, none]
        default: sandbox
      core_mode:
        description: "How the core (the build root the flavors are installed into) is made. repo = unpack the previous release's rootfs and install everything from the package repository: minutes, nothing compiled. build = compile it (seed -> stage1 -> stage2 -> stage3: hours). auto = repo when a previous release carries a rootfs, else build"
        type: choice
        options: [auto, repo, build]
        default: auto
      stage3_world:
        description: "Rebuild every package in stage 3 (core_mode build only)"
        type: boolean
        default: true
      resume:
        description: "Resume from the cached build target of the previous run (uncheck for a clean start)"
        type: boolean
        default: false
      seed:
        description: "Build seed: auto = previous release's rootfs if there is one, else Debian; rootfs = require it; debian = always start from the Debian seed"
        type: choice
        options: [auto, rootfs, debian]
        default: auto
      recipes_ref:
        description: "faseela-repo branch, tag or commit to build the recipes from (empty = its default branch)"
        type: string
        default: ""
      release:
        description: "Publish a GitHub Release from this run (no tag needed): whatever was built, `outputs=core` gives a release with the seed rootfs only"
        type: boolean
        default: false
      release_tag:
        description: "Name of that release (empty = build-<date>-r<run number>); it must not exist yet"
        type: string
        default: ""
      verify_reproducible:
        description: "After the core: rebuild it once more (stage 4) and compare with stage 3. Report only; adds hours and modifies the cached target, so use it on a run you can throw away"
        type: boolean
        default: false
      pkg_repo:
        description: "Package repository the flavors are installed from (http(s) URL; empty = faseela-repo release `stable`)"
        type: string
        default: ""
      flavor_from:
        description: "repo = a package missing from the repository fails the flavor; auto = compile what is missing (slow)"
        type: choice
        options: [repo, auto]
        default: repo

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET: /mnt/faseela
  ROOTFS_ASSET: faseela-x86_64-rootfs.tar.zst

jobs:
  # The ONE place that decides which faseela-repo commit this whole run builds:
  # a branch that moves while the run is going must not split it in two.
  recipes:
    name: recipes revision
    runs-on: ubuntu-24.04
    outputs:
      rev: ${{ steps.r.outputs.rev }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          RECIPES_REF: ${{ inputs.recipes_ref }}
        run: |
          set -euo pipefail
          rev="$(bash bootstrap/fetch-recipes.sh --resolve)"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "### Recipes: faseela-repo@$rev" >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: recipes
    uses: ./.github/workflows/ci.yml
    # a called workflow cannot ask for more than its caller grants; ci.yml's
    # `CI passed` job reads the run's jobs for its own report
    permissions:
      contents: read
      actions: read
    with:
      recipes_ref: ${{ needs.recipes.outputs.rev }}

  # Turns the `outputs` selection into a matrix using the pinned flavors.toml.
  plan:
    name: plan
    needs: [recipes, ci]
    runs-on: ubuntu-24.04
    outputs:
      recipes_rev: ${{ needs.recipes.outputs.rev }}
      matrix: ${{ steps.m.outputs.matrix }}
      isos: ${{ steps.m.outputs.isos }}
      has_iso: ${{ steps.m.outputs.has_iso }}
      has_variants: ${{ steps.m.outputs.has_variants }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the recipes (faseela-repo @ the commit chosen by this run)
        env:
          RECIPES_REF: ${{ needs.recipes.outputs.rev }}
        run: bash bootstrap/fetch-recipes.sh
      - id: m
        env:
          ONLY: ${{ inputs.outputs || 'all' }}
        run: |
          # flavors.toml is fetched above at the pinned faseela-repo commit.
          # The planner discovers ISO/rootfs flavors and derives their output
          # names, volume IDs, and the ISO-only QEMU matrix.
          python3 -I scripts/plan-flavors.py --selection "$ONLY" > flavor-plan.json
          python3 - flavor-plan.json >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          for key in ("matrix", "isos"):
              print(f"{key}=" + json.dumps(plan[key], separators=(",", ":")))
          for key in ("has_iso", "has_variants"):
              print(f"{key}=" + ("true" if plan[key] else "false"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Discovered flavor build plan\n\n")
              summary.write("| flavor | output |\n|---|---|\n")
              for item in plan["matrix"]["include"]:
                  output = item.get("iso") or item.get("rootfs")
                  summary.write(f"| `{item['variant']}` | `{output}` |\n")
              if not plan["matrix"]["include"]:
                  summary.write("| _core only_ | bootstrap seed |\n")
          PY
      # Minutes instead of hours: does the package repository hold what the
      # flavors will install? A warning, not a failure: packages.yml may be
      # publishing them while the core builds (the flavor jobs run last).
      - name: Does the package repository have the flavors' packages?
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ steps.m.outputs.matrix }}
          PKG_REPO: ${{ inputs.pkg_repo }}
        run: |
          if [[ -n "$PKG_REPO" ]]; then
            echo "custom repository ($PKG_REPO): not checked here"; exit 0
          fi
          variants="$(python3 -c 'import json,os; print(" ".join(v["variant"] for v in json.loads(os.environ["MATRIX"])["include"]))')"
          [[ -n "$variants" ]] || { echo "outputs=core: no flavors to check"; exit 0; }
          gh release view stable --repo "${GITHUB_REPOSITORY_OWNER}/faseela-repo" --json assets \
            --jq '.assets[].name' > assets.txt \
            || { echo "::warning::no package repository yet (faseela-repo release 'stable'): run its 'Build packages' workflow first"; exit 0; }
          if ! python3 -I scripts/check-flavor-packages.py assets.txt $variants | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "::warning::the package repository lacks packages of a flavor: run faseela-repo > Build packages > packages: flavor:<name> before the flavor jobs start"
          fi

      # Fail fast: the stage3 self-host proof ("a binary needs a library that
      # is not in the root") run on the bootstrap packages ALREADY published,
      # before the multi-hour core. A leak (perl -> libcrypt.so.1) stops here,
      # naming the package, instead of after two hours of building.
      - name: Closure check of the bootstrap flavor (fail fast)
        if: ${{ inputs.pkg_repo == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - > patterns.txt <<'PY'
          import sys, tomllib
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import flavor
          fl = flavor.load_flavors(Path("flavors.toml"))
          rc = flavor.load_recipes(Path("recipes"))
          ids = {}
          for f in Path("recipes").glob("*/*/recipe.toml"):
              p = tomllib.loads(f.read_text())["package"]
              ids[p["name"]] = f"{p['name']}-{p['version']}-{p.get('rel', 1)}"
          for n in flavor.resolve(fl, rc, "bootstrap"):
              print(f"{ids[n]}.nawa.tar.zst")
          PY
          mkdir -p closure-archives
          args=(); while read -r a; do args+=(-p "$a"); done < patterns.txt
          if ! gh release download stable --repo "${GITHUB_REPOSITORY_OWNER}/faseela-repo" \
               --dir closure-archives --clobber "${args[@]}" 2>&1 | tail -3; then
            echo "::warning::could not download the bootstrap packages: closure not checked"; exit 0
          fi
          python3 -I scripts/check-closure.py closure-archives bootstrap | tee -a "$GITHUB_STEP_SUMMARY"

  core:
    name: core (seed → stage3 → rootfs)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      seed: ${{ steps.rootfsseed.outputs.path != '' && 'the previous release rootfs (self-hosting)' || 'the Debian-based bootstrap seed' }}
    env:
      ISOLATION: ${{ inputs.isolation || 'sandbox' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the recipes (faseela-repo @ the commit chosen by this run)
        env:
          RECIPES_REF: ${{ needs.plan.outputs.recipes_rev }}
        run: bash bootstrap/fetch-recipes.sh

      # Seed selection, BEFORE the Debian-seed cache so a rootfs seed does not
      # restore (and later save) a ~330 MB seed it will not use. The download
      # is verified against the release's .sha256 inside the script; a
      # mismatch or a gh failure fails the job (never a silent fallback to a
      # different seed).
      - name: Choose the seed (previous release's rootfs, else Debian)
        id: rootfsseed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SEED_MODE: ${{ inputs.seed || 'auto' }}
        run: |
          if [[ "$SEED_MODE" == debian ]]; then
            echo "seed: Debian (requested)"
            echo "### Seed: Debian-based (requested)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rc=0
          path="$(bash scripts/fetch-rootfs-seed.sh "$RUNNER_TEMP/rootfs-seed")" || rc=$?
          case "$rc" in
            0)
              # A rootfs is only a usable seed if it can compile: the gcc
              # driver alone is not enough (stage1 dies on "cannot execute
              # 'cc1'"). Check the archive listing before committing to it.
              listing="$(zstd -dc "$path" | tar -t 2>/dev/null || true)"
              if grep -qE '/libexec/gcc/[^/]+/[^/]+/cc1$' <<< "$listing" \
                 && grep -qE '/libexec/gcc/[^/]+/[^/]+/cc1plus$' <<< "$listing"; then
                echo "path=$path" >> "$GITHUB_OUTPUT"
                echo "### Seed: previous release's rootfs (self-hosting)" >> "$GITHUB_STEP_SUMMARY"
                echo "sha256: $(cut -d' ' -f1 "$path.sha256")" >> "$GITHUB_STEP_SUMMARY"
              elif [[ "$SEED_MODE" == rootfs ]]; then
                echo "::error::the previous release's rootfs has no gcc cc1/cc1plus - it cannot seed a build"
                exit 1
              else
                echo "::warning::the previous release's rootfs has no gcc cc1/cc1plus (unusable seed) - falling back to the Debian seed"
                echo "### Seed: Debian-based (previous rootfs is broken: no cc1/cc1plus)" >> "$GITHUB_STEP_SUMMARY"
                rm -f "$path" "$path.sha256"
              fi ;;
            3)
              if [[ "$SEED_MODE" == rootfs ]]; then
                echo "::error::seed=rootfs, but no release carries $ROOTFS_ASSET"
                exit 1
              fi
              echo "::notice::no published rootfs yet - bootstrapping from the Debian seed"
              echo "### Seed: Debian-based (no release carries a rootfs yet)" >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "::error::could not fetch/verify the rootfs seed (fetch-rootfs-seed.sh exit $rc)"
              exit "$rc" ;;
          esac

      # repo = the fast path: every package is already built and published by
      # faseela-repo, so the core is only the previous release's rootfs plus the
      # `seed` flavor installed from the repository. build = compile the
      # bootstrap set (stage 2/3), needed once to start, or to prove self-hosting.
      - name: Choose how the core is made (repository or compile)
        id: coremode
        env:
          WANT: ${{ inputs.core_mode || 'auto' }}
          HAVE_SEED: ${{ steps.rootfsseed.outputs.path != '' }}
        run: |
          case "$WANT" in
            build) mode=build ;;
            repo)
              [[ "$HAVE_SEED" == true ]] || {
                echo "::error::core_mode=repo needs the previous release's rootfs as the seed: run once with core_mode=build (and seed=auto|rootfs)"
                exit 1; }
              mode=repo ;;
            *) if [[ "$HAVE_SEED" == true ]]; then mode=repo; else mode=build; fi ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "### Core: $([[ $mode == repo ]] && echo 'assembled from the package repository (nothing compiled)' || echo 'compiled (stage 2 + 3)')" >> "$GITHUB_STEP_SUMMARY"

      # The hosted runner already has ~100 GB free; removing dotnet/android/ghc
      # cost ~52 s per run. Opt in with the repository variable FREE_DISK=true.
      - name: Free disk space (opt-in)
        if: ${{ vars.FREE_DISK == 'true' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h / /mnt

      # The Debian seed (~330 MB) only changes when its builder does. Restore
      # here, save AFTER the build with `always()`: a plain actions/cache step
      # saves only when the job succeeds, so a failed run lost the seed while
      # the target cache (whose stamps say "seed done") survived.
      - name: Restore the bootstrap seed
        id: seedcache
        if: ${{ steps.rootfsseed.outputs.path == '' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            bootstrap/seed/seed.tar.zst
            bootstrap/seed/seed.tar.zst.sha256
          key: seed-${{ runner.os }}-${{ hashFiles('bootstrap/seed/build-seed.sh', 'bootstrap/seed/seed.toml') }}

      # Resume = restore the whole build target (/mnt/faseela + its state dir)
      # saved by the previous dispatch run, even if that run failed or timed
      # out. Stage 2 skips packages that are already installed. A fresh tag
      # build is always clean; only "Re-run failed jobs" of a tag run
      # (run_attempt > 1) resumes from what the failed attempt saved.
      - name: Restore the previous build target
        id: tgtcache
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.resume) || (github.event_name == 'push' && github.run_attempt > 1) }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/target.tar.zst
          key: iso-target-${{ runner.os }}-never-matches
          restore-keys: |
            iso-target-${{ runner.os }}-

      - name: Unpack the previous build target
        if: ${{ steps.tgtcache.outputs.cache-matched-key != '' }}
        run: |
          ls -lh "$RUNNER_TEMP/target.tar.zst"
          sudo tar -I zstd -xpf "$RUNNER_TEMP/target.tar.zst" -C /mnt --numeric-owner
          rm -f "$RUNNER_TEMP/target.tar.zst"
          ls /mnt

      # Package cache: the archives (+ .buildid sidecars) of every package the
      # previous runs built. stage2 reuses an archive whose build_id still
      # matches (nawa build --use-cache), so a rerun after a one-recipe fix
      # rebuilds that recipe, not gcc + linux + cmake again. The key carries a
      # hash of the toolchain recipes, profiles and stage scripts: touching
      # glibc/gcc/binutils/the profile drops the whole cache (build_id does not
      # cover dependencies' versions at stage-2 isolation levels). Set the
      # repository variable PKGCACHE=false to build everything from scratch.
      - name: Restore the package cache
        id: pkgcache
        if: ${{ vars.PKGCACHE != 'false' && steps.tgtcache.outputs.cache-matched-key == '' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/pkgcache
          key: pkgs-${{ hashFiles('recipes/toolchain/**', 'profiles/**', 'bootstrap/stage2-inner.sh') }}-never-matches
          restore-keys: |
            pkgs-${{ hashFiles('recipes/toolchain/**', 'profiles/**', 'bootstrap/stage2-inner.sh') }}-

      - name: Place the cached archives in the build target
        if: ${{ steps.pkgcache.outputs.cache-matched-key != '' }}
        run: |
          sudo mkdir -p "$TARGET/build/out"
          sudo cp -a "$RUNNER_TEMP/pkgcache/." "$TARGET/build/out/"
          ls "$TARGET/build/out" | wc -l

      # No ISO host tools here: the ISOs are made by the matrix jobs.
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc make curl zstd ca-certificates util-linux

      - name: Allow unprivileged user namespaces, disable core dumps
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # a crash loop must not spend ~1 s per crash writing cores
          sudo sysctl -w kernel.core_pattern='|/bin/false' || true

      # Minutes, not hours: an unreachable source host fails here instead of
      # at package 102 of stage 2. Needs only python3 (preinstalled).
      - name: Check that every recipe source is reachable
        if: ${{ steps.coremode.outputs.mode == 'build' }}
        run: python3 scripts/check-sources.py

      - name: Make the core (from the package repository, or compile it)
        id: build
        timeout-minutes: 320 # leaves ~35 min of the 355 for saving the cache and logs
        env:
          CORE_MODE: ${{ steps.coremode.outputs.mode }}
          PKG_REPO: ${{ inputs.pkg_repo }}
          ROOTFS_SEED: ${{ steps.rootfsseed.outputs.path }}
          # tag pushes have no `inputs`: they get the same defaults as the form
          # (a release must rebuild every package in stage 3, not only nawa)
          STAGE3_WORLD: ${{ github.event_name != 'workflow_dispatch' || inputs.stage3_world }}
          STAGE2_USE_CACHE: ${{ vars.PKGCACHE != 'false' && '1' || '0' }}
        run: |
          if [[ "$CORE_MODE" == repo ]]; then
            # stage 1 only (unpack the seed, mount, verify the toolchain); the
            # `seed` flavor (flavors.toml) is then INSTALLED from the package
            # repository into /sysroot-seed and packed as the next seed
            sudo -E env SEED_ROOTFS="$ROOTFS_SEED" bash bootstrap/stage1.sh "$TARGET"
            # the state dir build-all.sh would have made: the target is packed with it
            sudo mkdir -p "$(dirname -- "$TARGET")/.$(basename -- "$TARGET").build"
            margs=(--from repo)
            [[ -n "$PKG_REPO" ]] && margs+=(--repo "$PKG_REPO")
            sudo -E bash bootstrap/mkflavor.sh "${margs[@]}" "$TARGET" seed
            mkdir -p out
            sudo -E bash bootstrap/mkrootfs.sh "$TARGET/sysroot-seed" "$GITHUB_WORKSPACE/out/$ROOTFS_ASSET"
            sudo chown -R "$(id -u):$(id -g)" out
            exit 0
          fi
          args=(--isolation "$ISOLATION" --no-iso
                --rootfs-out "$GITHUB_WORKSPACE/out/$ROOTFS_ASSET")
          [[ "$STAGE3_WORLD" == "true" ]] && args+=(--stage3-world)
          # self-hosting: the previous release's rootfs replaces the Debian seed
          [[ -n "$ROOTFS_SEED" ]]         && args+=(--seed-rootfs "$ROOTFS_SEED")
          sudo -E ./bootstrap/build-all.sh "${args[@]}" "$TARGET"

      # stage 2 (seed compiler) and stage 3 (our compiler) differ by design; the
      # fixed-point check is stage 3 against stage 4. Report only.
      - name: Verify the core is reproducible (stage 3 = stage 4)
        if: ${{ steps.build.outcome == 'success' && steps.coremode.outputs.mode == 'build' && inputs.verify_reproducible }}
        continue-on-error: true
        run: |
          sudo -E env ISOLATION="$ISOLATION" STAGE3_ISOLATION="$ISOLATION" \
            bash bootstrap/verify-reproducible.sh run "$TARGET" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the bootstrap seed (also on failure)
        if: ${{ always() && steps.seedcache.outputs.cache-hit != 'true' && hashFiles('bootstrap/seed/seed.tar.zst') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            bootstrap/seed/seed.tar.zst
            bootstrap/seed/seed.tar.zst.sha256
          key: seed-${{ runner.os }}-${{ hashFiles('bootstrap/seed/build-seed.sh', 'bootstrap/seed/seed.toml') }}

      # One tarball, two uses: the resume cache of the next dispatch run, and
      # the hand-over to the matrix jobs. Packed after a failure only when a
      # dispatch run may resume from it.
      - name: Pack the build target
        id: packtgt
        if: ${{ always() && steps.build.conclusion != 'skipped' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.build.outcome == 'success') }}
        continue-on-error: true
        run: |
          sudo ./bootstrap/umount-chroot.sh "$TARGET" || true
          sudo tar -I 'zstd -T0 -3' --one-file-system -cpf "$RUNNER_TEMP/target.tar.zst" --numeric-owner \
            --exclude='faseela/build/*/src' --exclude='faseela/build/*/pkg' \
            --exclude='faseela/sysroot-seed' \
            -C /mnt faseela .faseela.build
          ls -lh "$RUNNER_TEMP/target.tar.zst"

      - name: Pack the package cache
        id: packpkgs
        if: ${{ always() && vars.PKGCACHE != 'false' && steps.build.conclusion != 'skipped' && steps.coremode.outputs.mode == 'build' }}
        continue-on-error: true
        run: |
          rm -rf "$RUNNER_TEMP/pkgcache" && mkdir -p "$RUNNER_TEMP/pkgcache"
          sudo cp -a "$TARGET/build/out/." "$RUNNER_TEMP/pkgcache/"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/pkgcache"
          du -sh "$RUNNER_TEMP/pkgcache"; ls "$RUNNER_TEMP/pkgcache" | wc -l

      - name: Save the package cache
        if: ${{ always() && steps.packpkgs.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pkgcache
          key: pkgs-${{ hashFiles('recipes/toolchain/**', 'profiles/**', 'bootstrap/stage2-inner.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the build target cache (resume)
        if: ${{ always() && steps.packtgt.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/target.tar.zst
          key: iso-target-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Checksums
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          # build-all.sh runs under sudo: out/ is root-owned
          sudo chown -R "$(id -u):$(id -g)" out
          cd out
          # the rootfs checksum was written by mkrootfs.sh; re-verify it here,
          # because the NEXT build trusts exactly this file as its seed
          sha256sum -c "$ROOTFS_ASSET.sha256"
          {
            echo "### Core rootfs"
            echo "| | |"; echo "|---|---|"
            echo "| file | \`$ROOTFS_ASSET\` ($(du -h "$ROOTFS_ASSET" | cut -f1)) |"
            echo "| sha256 | \`$(cut -d' ' -f1 "$ROOTFS_ASSET.sha256")\` |"
            [[ -f faseela-x86_64-rootfs.packages ]] && echo "| packages | $(wc -l < faseela-x86_64-rootfs.packages) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the core target for the matrix jobs
        if: ${{ steps.build.outcome == 'success' && steps.packtgt.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: core-target
          path: ${{ runner.temp }}/target.tar.zst
          retention-days: 3   # re-running a failed matrix job needs it; 1 day expired overnight
          compression-level: 0

      - name: Upload the rootfs (the seed of the next build)
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: out-rootfs
          path: |
            out/faseela-x86_64-rootfs.tar.zst
            out/faseela-x86_64-rootfs.tar.zst.sha256
            out/faseela-x86_64-rootfs.packages
          retention-days: 14
          compression-level: 0

      - name: Collect build logs
        if: always()
        run: |
          mkdir -p ci-logs
          sudo cp -r /mnt/.faseela.build/logs ci-logs/ 2>/dev/null || true
          sudo cp /mnt/.faseela.build/meta ci-logs/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" ci-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-core
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

      # Why it failed, without opening a 60 MB log: the stage that died, the
      # ERROR lines before it and the last lines. Shown in this job's summary
      # and repeated by the final `run report` job.
      - name: Failure excerpt
        if: ${{ always() && steps.build.conclusion != 'skipped' }}
        continue-on-error: true
        run: |
          mkdir -p report
          log="$(find ci-logs/logs -name 'build-*.log' -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-)"
          if [[ -n "$log" ]]; then
            python3 scripts/ci-report.py excerpt "$log" --title "core" | tee report/core.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-core
          path: report
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------- matrix
  build:
    name: ${{ matrix.variant }}
    needs: [plan, core]
    # outputs=core builds the bootstrap only (no flavors, e.g. for the very first release)
    if: ${{ needs.plan.outputs.has_variants == 'true' }}
    runs-on: ubuntu-24.04
    # installing packages and squashing an image: no compiling here
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PKG_REPO: ${{ inputs.pkg_repo }}
      FLAVOR_FROM: ${{ inputs.flavor_from || 'repo' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the recipes (faseela-repo @ the commit chosen by this run)
        env:
          RECIPES_REF: ${{ needs.plan.outputs.recipes_rev }}
        run: bash bootstrap/fetch-recipes.sh

      - uses: actions/download-artifact@v4
        with:
          name: core-target
          path: ${{ runner.temp }}/core

      - name: Unpack the core target
        run: |
          sudo tar -I zstd -xpf "$RUNNER_TEMP/core/target.tar.zst" -C /mnt --numeric-owner
          rm -rf "$RUNNER_TEMP/core"
          df -h /mnt

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools \
            gcc make curl zstd ca-certificates util-linux python3

      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.core_pattern='|/bin/false' || true

      # The flavor = the packages flavors.toml lists for it, INSTALLED from the
      # package repository into an empty root next to the core's (nothing is
      # compiled). A package the repository lacks stops this step with a list.
      - name: Install the ${{ matrix.variant }} flavor from the package repository
        run: |
          args=(--from "$FLAVOR_FROM")
          [[ -n "$PKG_REPO" ]] && args+=(--repo "$PKG_REPO")
          sudo bash bootstrap/mkflavor.sh "${args[@]}" "$TARGET" "${{ matrix.variant }}"

      # What is in the image, biggest first: the answer to "why is the ISO
      # N GiB" is on the run summary instead of in a guess.
      - name: Size report of the shipped system
        if: ${{ matrix.kind == 'iso' }}
        run: |
          root="$TARGET/sysroot-${{ matrix.variant }}"
          {
            echo "### Size of ${{ matrix.variant }} before squashing"
            echo '```'
            for d in usr/lib/firmware usr/lib/modules lib/modules usr/lib/rustlib usr/lib/gcc usr/libexec/gcc boot; do
              [[ -e $root/$d ]] && sudo du -sh "$root/$d"
            done
            echo "--- biggest directories (usr, depth 3)"
            sudo du -xh --max-depth=3 "$root/usr" 2>/dev/null | sort -h | tail -15
            echo "--- biggest files"
            sudo find "$root" -xdev -type f -printf '%s %P\n' 2>/dev/null | sort -n | tail -10 | numfmt --to=iec --field=1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Make the ISO
        if: ${{ matrix.kind == 'iso' }}
        env:
          ISO_NAME: ${{ matrix.iso }}
          VOL_ID: ${{ matrix.vol }}
        run: |
          mkdir -p out
          sudo env VOL_ID="$VOL_ID" NAWA_JOBS="$(nproc)" \
            bash bootstrap/mkiso.sh "$TARGET/sysroot-${{ matrix.variant }}" "$PWD/out/$ISO_NAME"
          sudo chown -R "$(id -u):$(id -g)" out
          cd out
          sha256sum "$ISO_NAME" | tee "$ISO_NAME.sha256"
          ls -lh .
          echo "### ${{ matrix.variant }}: \`$ISO_NAME\` ($(du -h "$ISO_NAME" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          # a release asset is limited to 2 GiB: say so here, not at the very end of the run
          if (( $(stat -c %s "$ISO_NAME") >= 2147483648 )); then
            echo "::warning::$ISO_NAME is >= 2 GiB: it will not fit in the GitHub Release (trim the firmware list in profiles/firmware-iso.txt, or the packages)"
            echo "> ⚠️ over 2 GiB — will not be attached to the release" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Make the small base-devel rootfs
        if: ${{ matrix.kind == 'rootfs' }}
        run: |
          mkdir -p out
          sudo bash bootstrap/mkrootfs.sh "$TARGET/sysroot-${{ matrix.variant }}" "$PWD/out/${{ matrix.rootfs }}"
          sudo chown -R "$(id -u):$(id -g)" out
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.variant }}
          path: out/*
          retention-days: 14
          compression-level: 0

      - name: Collect build logs
        if: always()
        run: |
          mkdir -p ci-logs
          sudo cp -r /mnt/.faseela.build/logs ci-logs/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" ci-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ matrix.variant }}
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Failure excerpt
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          mkdir -p report
          log="$(find ci-logs/logs -name 'build-*.log' -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-)"
          if [[ -n "$log" ]]; then
            python3 scripts/ci-report.py excerpt "$log" --title "${{ matrix.variant }}" \
              | tee "report/${{ matrix.variant }}.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: report-${{ matrix.variant }}
          path: report
          if-no-files-found: ignore
          retention-days: 14

  # Boots every ISO in QEMU (BIOS, through grub) and waits for the login
  # prompt on the serial console (scripts/qemu-boot-test.sh). On a tag this
  # gates the release: an ISO that does not boot is never published.
  boot-test:
    name: boot ${{ matrix.variant }} in QEMU
    needs: [plan, build]
    # one failed matrix leg (say rootfs-min) must not stop the ISOs that did
    # build from being booted; skipped only when nothing was built at all
    if: ${{ !cancelled() && needs.plan.outputs.has_iso == 'true' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.isos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: dl
        continue-on-error: true
        with:
          name: out-${{ matrix.variant }}
          path: iso
      - name: The ISO must exist
        if: ${{ steps.dl.outcome != 'success' }}
        run: |
          echo "::error::no ISO artifact for ${{ matrix.variant }}: its build job failed or was cancelled"
          exit 1
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 socat
          # hosted Linux runners expose /dev/kvm, but only root may use it
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true
      - name: Verify the ISO checksum
        env:
          ISO_NAME: ${{ matrix.iso }}
        run: cd iso && sha256sum -c "$ISO_NAME.sha256"
      - name: Boot it and wait for the login prompt
        env:
          ISO_NAME: ${{ matrix.iso }}
        run: bash scripts/qemu-boot-test.sh "iso/$ISO_NAME" qemu-boot
      - name: Serial console tail
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          mkdir -p report
          {
            echo "### ❌ boot ${{ matrix.variant }}: no login prompt"
            echo; echo "<details open><summary>Last serial console lines</summary>"; echo; echo '```'
            tail -n 40 qemu-boot/serial.log 2>/dev/null | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' || echo "(no serial log)"
            echo '```'; echo; echo "</details>"
          } | tee "report/boot-${{ matrix.variant }}.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: report-boot-${{ matrix.variant }}
          path: report
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-boot-${{ matrix.variant }}
          path: qemu-boot
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: GitHub Release
    needs: [plan, core, build, boot-test]
    # a `v*` tag, or a manual run with `release` ticked. build / boot-test may be
    # skipped (outputs=core), but a failure of either still blocks the release.
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.release) && needs.core.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.build.result) && contains(fromJSON('["success","skipped"]'), needs.boot-test.result) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ needs.core.outputs.seed }}
          RECIPES_REV: ${{ needs.plan.outputs.recipes_rev }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          ls -lh artifacts
          # the release name: the pushed tag, else the input, else build-<date>-r<run>
          TAG="$INPUT_TAG"
          if [[ -z "$TAG" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"
            else TAG="build-$(date -u +%Y%m%d-%H%M)-r${GITHUB_RUN_NUMBER}"; fi
          fi
          [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::bad release name '$TAG'"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::the release '$TAG' already exists: give release_tag another name"; exit 1
          fi
          # A release asset is limited to 2 GiB. Bigger files stay workflow
          # artifacts and the release carries only the checksum files. The
          # rootfs and its .sha256 are what the NEXT build downloads as its
          # seed (scripts/fetch-rootfs-seed.sh).
          files=()
          for f in artifacts/*; do
            size=$(stat -c %s "$f")
            case "$f" in *.sha256|*.packages) ;; *)
              if (( size >= 2147483648 )); then
                echo "::warning::$f is $size bytes (>= 2 GiB): left as a workflow artifact"
                continue
              fi ;;
            esac
            files+=("$f")
          done
          (( ${#files[@]} )) || { echo "::error::no build output to publish"; exit 1; }
          # Describe the artifacts actually produced by the dynamically selected flavors.
          {
            echo '| file | what |'; echo '|---|---|'
            shopt -s nullglob
            for f in artifacts/*; do
              base="${f##*/}"
              what=""
              case "$base" in
                faseela-x86_64.iso) what="live ISO without a graphical desktop" ;;
                faseela-gui-x86_64.iso) what="live ISO with the Sway / Wayland desktop" ;;
                faseela-*-x86_64.iso)
                  flavor="iso-${base#faseela-}"
                  flavor="${flavor%-x86_64.iso}"
                  what="live ISO for flavor \`$flavor\`" ;;
                faseela-x86_64-rootfs-min.tar.zst)
                  what="small build rootfs: base-devel + nawa" ;;
                faseela-x86_64-rootfs.tar.zst)
                  what="bootstrap seed rootfs for the next self-hosting build" ;;
                faseela-*-x86_64-rootfs.tar.zst)
                  flavor="${base#faseela-}"
                  flavor="${flavor%-x86_64-rootfs.tar.zst}"
                  what="root filesystem for flavor \`$flavor\`" ;;
              esac
              [[ -n "$what" ]] && printf '%s\n' "| \`$base\` | $what"
            done
            echo "This release was built from: ${SEED}."
            echo
            echo "Recipes: [faseela-repo@${RECIPES_REV:0:12}](https://github.com/mrdevmohamed/faseela-repo/tree/${RECIPES_REV})."
            echo "To rebuild this release from the same recipes, run *Build ISO (CD)* with \`recipes_ref\` = \`${RECIPES_REV}\`."
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --generate-notes --notes-file notes.md "${files[@]}"
          echo "### Release \`$TAG\`: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"

  # Always runs, last, whatever happened (also on failure and cancel): one page
  # that says what happened, so nobody has to open the jobs one by one.
  # Written to the run summary and kept as the `run-report` artifact.
  report:
    name: run report
    if: ${{ always() }}
    needs: [recipes, ci, plan, core, build, boot-test, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read   # list this run's jobs and artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true   # none exist when nothing failed
        with:
          pattern: report-*
          path: report-parts
          merge-multiple: true
      - name: Write the report
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RECIPES_REV: ${{ needs.plan.outputs.recipes_rev || needs.recipes.outputs.rev }}
          SEED: ${{ needs.core.outputs.seed }}
          ISOLATION: ${{ inputs.isolation || 'sandbox' }}
          OUTPUTS: ${{ inputs.outputs || 'all' }}
        run: |
          printf '%s' "$NEEDS" > needs.json
          facts=(--fact "Outputs=$OUTPUTS" --fact "Isolation=$ISOLATION")
          [[ -n "$RECIPES_REV" ]] && facts+=(--fact "Recipes=[faseela-repo@${RECIPES_REV:0:12}](https://github.com/mrdevmohamed/faseela-repo/tree/$RECIPES_REV)")
          [[ -n "$SEED" ]]        && facts+=(--fact "Seed=$SEED")
          python3 scripts/ci-report.py report --needs-json needs.json --extra report-parts "${facts[@]}" \
            | tee run-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: run-report.md
          retention-days: 30
  # One combined notification after the complete release report, even if a
  # build, optional flavor, boot test, or publication failed.
  telegram-notify:
    name: Telegram notification
    if: ${{ always() }}
    needs: [recipes, ci, plan, core, build, boot-test, release, report]
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Send workflow result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_RESULTS: recipes=${{ needs.recipes.result }},ci=${{ needs.ci.result }},plan=${{ needs.plan.result }},core=${{ needs.core.result }},build=${{ needs.build.result }},boot-test=${{ needs.boot-test.result }},release=${{ needs.release.result }},report=${{ needs.report.result }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: python3 -I scripts/notify-telegram.py
