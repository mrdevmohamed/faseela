name: Boot existing installed-disk artifact

on:
  push:
    branches:
      - debug/boot-existing-artifact

permissions:
  contents: read
  actions: read

jobs:
  compare:
    name: Boot the exact disk from the failed acceptance run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download the failed run's installed-disk artifact
        uses: actions/download-artifact@v4
        with:
          name: qemu-boot-iso-nogui
          path: previous-run
          run-id: 44754248442
          github-token: ${{ github.token }}

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils

      - name: Find and inspect the BIOS installed disk
        id: disk
        shell: bash
        run: |
          set -euo pipefail
          echo "Artifact contents:"
          find previous-run -maxdepth 5 -type f -printf '%p (%s bytes)\\n' | sort
          disk="$(find previous-run -type f -path '*/bios/installed.qcow2' -print -quit)"
          test -n "$disk" || { echo "BIOS installed qcow2 was not present in the artifact"; exit 1; }
          echo "disk=$disk" >> "$GITHUB_OUTPUT"
          qemu-img info "$disk"

      - name: Inspect MBR, partition table, and installed GRUB files
        shell: bash
        env:
          INSTALLED_DISK: ${{ steps.disk.outputs.disk }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends grub-common grub-pc-bin gdisk fdisk e2fsprogs
          sudo modprobe nbd max_part=16
          sudo qemu-nbd --read-only --connect=/dev/nbd0 "$INSTALLED_DISK"
          cleanup() { sudo umount /mnt/faseela-inspect 2>/dev/null || true; sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true; }
          trap cleanup EXIT
          sudo partprobe /dev/nbd0 || true
          echo "### Partition table"
          sudo fdisk -l /dev/nbd0
          sudo sfdisk -d /dev/nbd0 || true
          echo "### Block devices"
          lsblk -o NAME,SIZE,TYPE,FSTYPE,UUID,PARTUUID /dev/nbd0
          echo "### MBR signature and partition table bytes"
          sudo dd if=/dev/nbd0 bs=512 count=1 status=none | od -Ax -tx1z
          echo "### First sectors after MBR (GRUB embedding area)"
          sudo dd if=/dev/nbd0 bs=512 skip=1 count=32 status=none | strings -a | head -100 || true
          echo "### Filesystem checks"
          sudo blkid /dev/nbd0p1 || true
          sudo e2fsck -fn /dev/nbd0p1 || true
          sudo mkdir -p /mnt/faseela-inspect
          sudo mount -o ro,noload /dev/nbd0p1 /mnt/faseela-inspect
          echo "### GRUB directory"
          sudo find /mnt/faseela-inspect/boot/grub -maxdepth 3 -type f -printf '%P (%s bytes)\\n' | sort
          echo "### Core image inspection"
          sudo file /mnt/faseela-inspect/boot/grub/i386-pc/core.img
          sudo grub-file --is-i386-pc /mnt/faseela-inspect/boot/grub/i386-pc/core.img && echo "core.img: valid i386-pc image" || echo "core.img: INVALID i386-pc image"
          sudo grub-script-check /mnt/faseela-inspect/boot/grub/grub.cfg
          echo "### Installed GRUB config"
          sudo cat /mnt/faseela-inspect/boot/grub/grub.cfg
          echo "### Kernel links"
          sudo ls -la /mnt/faseela-inspect/boot/vmlinuz /mnt/faseela-inspect/boot/initramfs.img
          echo "### GRUB core image hashes and sizes"
          sudo sha256sum /mnt/faseela-inspect/boot/grub/i386-pc/core.img
          sudo du -h /mnt/faseela-inspect/boot/grub/i386-pc/core.img

      - name: Reinstall BIOS GRUB with a fresh disk map on a disposable overlay
        id: repair
        shell: bash
        env:
          INSTALLED_DISK: ${{ steps.disk.outputs.disk }}
        run: |
          set -euo pipefail
          repair="$RUNNER_TEMP/faseela-grub-recheck.qcow2"
          qemu-img create -f qcow2 -F qcow2 -b "$INSTALLED_DISK" "$repair"
          sudo modprobe nbd max_part=16
          sudo qemu-nbd --connect=/dev/nbd0 "$repair"
          root=/mnt/faseela-grub-recheck
          sudo mkdir -p "$root"
          cleanup() {
            sudo umount -R "$root" 2>/dev/null || true
            sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo partprobe /dev/nbd0 || true
          sudo mount /dev/nbd0p1 "$root"
          sudo mount --rbind /dev "$root/dev"
          sudo mount --make-rslave "$root/dev"
          sudo mount -t proc proc "$root/proc"
          sudo mount -t sysfs sysfs "$root/sys"
          echo "### Faseela GRUB toolchain"
          sudo chroot "$root" /usr/bin/grub-install --version
          test -x "$root/usr/bin/grub-install"
          echo "### Reinstall BIOS GRUB (fresh BIOS device map)"
          sudo chroot "$root" /usr/bin/env PATH=/usr/bin:/usr/sbin:/bin:/sbin \
            /usr/bin/grub-install --target=i386-pc --boot-directory=/boot --recheck --verbose /dev/nbd0
          echo "### New device map (if generated)"
          sudo cat "$root/boot/grub/device.map" 2>/dev/null || echo "(no persistent device.map)"
          echo "### Reinstalled GRUB core image"
          sudo ls -l "$root/boot/grub/i386-pc/core.img"
          sudo sha256sum "$root/boot/grub/i386-pc/core.img"
          sudo sync
          echo "disk=$repair" >> "$GITHUB_OUTPUT"

      - name: Boot the repaired BIOS disk with VirtIO and IDE
        shell: bash
        env:
          INSTALLED_DISK: ${{ steps.repair.outputs.disk }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          for interface in virtio ide; do
            python3 scripts/qemu-boot-existing-disk.py "$INSTALLED_DISK" \
              --interface "$interface" \
              --outdir "diagnostics/$interface" \
              --seconds 24
          done
          {
            echo "## BIOS disk boot after GRUB --recheck repair"
            for interface in virtio ide; do
              echo
              echo "### $interface"
              grep -E 'pid1_systemd|profile_systemd' "diagnostics/$interface/serial.log" || true
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-installed-disk-boot-diagnostics
          path: diagnostics
          if-no-files-found: warn
          retention-days: 14
