name: Build packages

# Builds dpm packages and publishes them to a SEPARATE repository that holds
# packages only. The package repo is a flat GitHub Release (one fixed tag,
# default `stable`): every archive is an asset, next to a signed index.toml.
# Clients use it with
#
#   dpm upgrade --repo https://github.com/<PKG_REPO>/releases/download/stable
#
# (`dpm upgrade --repo` takes an http(s) URL; archive names in the index are
# bare file names, which is exactly what a release's flat asset list is.)
#
# One-time setup in THIS repository (Settings > Secrets and variables > Actions):
#   variable PKG_REPO        owner/name of the packages repository
#   variable PKG_TAG         release tag used as the repo (optional, default stable)
#   secret   PKG_REPO_TOKEN  fine-grained token: Contents read+write on PKG_REPO only
#   secret   DPM_SIGN_KEY_B64   base64 of dpm.sec   (dpm keygen --out <dir>; base64 -w0 dpm.sec)
# The matching dpm.pub is what the distribution trusts (`dpm trust dpm.pub`).
#
# Which packages: those whose recipe directory changed in the push, or the
# names given to the manual run. Missing dependencies are built too and
# published with them. Dependents are NOT rebuilt automatically.
#
# Build environment: the rootfs of the newest release of this repository
#   rootfs=min   mydistro-x86_64-rootfs-min.tar.zst   base-devel + dpm, small, NO rust
#   rootfs=seed  mydistro-x86_64-rootfs.tar.zst       the full system incl. rust
# A package that needs rust (dpm itself) must be built with rootfs=seed,
# otherwise dpm would first compile rust from source.

on:
  push:
    branches: [main, master]
    paths: ["recipes/**"]
  workflow_dispatch:
    inputs:
      packages:
        description: "Package names, space separated (empty = recipes changed by this push)"
        type: string
        default: ""
      rootfs:
        description: "Build environment"
        type: choice
        options: [min, seed]
        default: min
      isolation:
        description: "dpm build isolation"
        type: choice
        options: [sandbox, env, closure, none]
        default: sandbox

permissions:
  contents: read

# two runs must not rewrite the same index.toml at the same time
concurrency:
  group: packages-publish
  cancel-in-progress: false

jobs:
  select:
    name: which packages
    runs-on: ubuntu-24.04
    outputs:
      pkgs: ${{ steps.s.outputs.pkgs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: s
        env:
          INPUT_PKGS: ${{ inputs.packages }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_PKGS// /}" ]]; then
            pkgs="$INPUT_PKGS"
          else
            base="${BEFORE:-}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse HEAD~1 2>/dev/null || true)"
            fi
            [[ -n "$base" ]] || { echo "::error::no commit to diff against - run it manually with 'packages'"; exit 1; }
            pkgs=""
            # recipes/<category>/<name>/...  ->  <name>, if its recipe still exists
            while IFS= read -r p; do
              [[ -n "$p" ]] || continue
              compgen -G "recipes/*/$p/recipe.toml" >/dev/null && pkgs+="$p "
            done < <(git diff --name-only "$base" "$GITHUB_SHA" -- recipes | awk -F/ 'NF >= 4 {print $3}' | sort -u)
          fi
          for p in $pkgs; do
            [[ "$p" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || { echo "::error::bad package name '$p'"; exit 1; }
            compgen -G "recipes/*/$p/recipe.toml" >/dev/null || { echo "::error::no recipe named '$p'"; exit 1; }
          done
          pkgs="$(echo $pkgs)"   # trim
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
          echo "### Packages: ${pkgs:-none}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build and publish
    needs: select
    if: ${{ needs.select.outputs.pkgs != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      T: /mnt/pkgroot
      PKGS: ${{ needs.select.outputs.pkgs }}
      ISOLATION: ${{ inputs.isolation || 'sandbox' }}
      ROOTFS_KIND: ${{ inputs.rootfs || 'min' }}
      PKG_REPO: ${{ vars.PKG_REPO }}
      PKG_TAG: ${{ vars.PKG_TAG || 'stable' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the publishing setup before spending hours building
        env:
          HAVE_TOKEN: ${{ secrets.PKG_REPO_TOKEN != '' }}
          HAVE_KEY: ${{ secrets.DPM_SIGN_KEY_B64 != '' }}
        run: |
          [[ -n "$PKG_REPO" ]]          || { echo "::error::repository variable PKG_REPO (owner/name) is not set"; exit 1; }
          [[ "$HAVE_TOKEN" == true ]]   || { echo "::error::secret PKG_REPO_TOKEN is not set"; exit 1; }
          [[ "$HAVE_KEY" == true ]]     || { echo "::error::secret DPM_SIGN_KEY_B64 is not set"; exit 1; }

      - name: Download the build rootfs from the newest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset=mydistro-x86_64-rootfs-min.tar.zst
          [[ "$ROOTFS_KIND" == seed ]] && asset=mydistro-x86_64-rootfs.tar.zst
          dir="$RUNNER_TEMP/rootfs"
          # verifies the .sha256 sidecar; exit 3 = no release carries the asset
          ROOTFS_ASSET="$asset" bash scripts/fetch-rootfs-seed.sh "$dir" > /dev/null
          sudo mkdir -p "$T"
          sudo tar -I zstd -xpf "$dir/$asset" -C "$T" --numeric-owner
          rm -rf "$dir"
          df -h /mnt

      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Prepare the build root
        run: |
          set -euo pipefail
          # network for the source downloads inside the root
          sudo rm -f "$T/etc/resolv.conf"
          sudo cp -L /etc/resolv.conf "$T/etc/resolv.conf"
          sudo bash bootstrap/sync-repo.sh "$T"          # recipes + profiles -> $T/mydistro
          sudo bash bootstrap/ensure-chroot-mounts.sh "$T"

      - name: Build
        run: |
          sudo bash bootstrap/enter-root.sh "$T" /usr/bin/env -i \
            HOME=/root TERM=dumb DPM_JOBS="$(nproc)" PKGS="$PKGS" ISOLATION="$ISOLATION" \
            bash /mydistro/bootstrap/build-packages-inner.sh

      - name: Publish to the package repository
        env:
          GH_TOKEN: ${{ secrets.PKG_REPO_TOKEN }}
          SIGN_KEY_B64: ${{ secrets.DPM_SIGN_KEY_B64 }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/repo"; mkdir -p "$repo"

          # the index must list the OLD packages too: fetch what is published
          if gh release view "$PKG_TAG" --repo "$PKG_REPO" > /dev/null 2>&1; then
            names="$(gh release view "$PKG_TAG" --repo "$PKG_REPO" --json assets --jq '.assets[].name' \
                     | grep -E '\.dpm\.tar\.zst$' || true)"
            if [[ -n "$names" ]]; then
              gh release download "$PKG_TAG" --repo "$PKG_REPO" --dir "$repo" \
                --pattern '*.dpm.tar.zst' --clobber
            fi
          else
            gh release create "$PKG_TAG" --repo "$PKG_REPO" --title "dpm package repository" \
              --notes "Flat dpm repository: *.dpm.tar.zst plus a signed index.toml. Written by CI, do not edit."
          fi

          shopt -s nullglob
          built=("$T"/build/out/*.dpm.tar.zst)
          (( ${#built[@]} )) || { echo "::error::the build left no archives in /build/out"; exit 1; }
          cp -f "${built[@]}" "$repo/"

          # sign the index inside the root (dpm links against the distro's libc)
          sudo mkdir -p "$T/repo"
          sudo cp -f "$repo"/*.dpm.tar.zst "$T/repo/"
          printf '%s' "$SIGN_KEY_B64" | base64 -d | sudo install -m 600 /dev/stdin "$T/root/dpm.sec"
          sudo bash bootstrap/enter-root.sh "$T" /usr/bin/dpm repo-create /repo \
            --out index.toml --sign --key /root/dpm.sec
          sudo shred -u "$T/root/dpm.sec" || sudo rm -f "$T/root/dpm.sec"
          sudo cp "$T/repo/index.toml" "$T/repo/index.toml.sig" "$repo/"
          sudo chown -R "$(id -u):$(id -g)" "$repo"

          # upload only what is new, plus the index
          upload=("$repo/index.toml" "$repo/index.toml.sig")
          for f in "${built[@]}"; do upload+=("$repo/$(basename "$f")"); done
          gh release upload "$PKG_TAG" --repo "$PKG_REPO" --clobber "${upload[@]}"

          {
            echo "### Published ${#built[@]} archive(s) to $PKG_REPO ($PKG_TAG)"
            echo
            echo '```'
            echo "dpm upgrade --repo https://github.com/$PKG_REPO/releases/download/$PKG_TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect build logs
        if: always()
        run: |
          mkdir -p ci-logs
          sudo cp -r "$T"/build/logs ci-logs/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" ci-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-build-logs
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14
