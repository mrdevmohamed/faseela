name: CI

# Everything this repository can test without building the whole distribution:
#
#   scripts             shell syntax, ShellCheck, recipe validation and every
#                       script-level test, plus build-all.sh dry runs at each
#                       isolation level
#
# nawa (the package manager) lives in its own repository,
# github.com/mrdevmohamed/nawa, which runs its cargo test suite, the isolation
# matrix and the CLI smoke tests. The recipes (and so the nawa commit that is
# shipped) live in github.com/mrdevmohamed/faseela-repo, which validates them
# in its own CI; here they are fetched (bootstrap/fetch-recipes.sh) so the
# scripts are tested against the real tree.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly: runner images change kernel / AppArmor settings under us
    - cron: "0 4 * * 1"
  workflow_call: # reused by release.yml as a gate before the ISO build
    inputs:
      recipes_ref:
        description: "faseela-repo branch, tag or commit to take the recipes from (empty = its default branch)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  scripts:
    name: scripts and recipes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the recipes (faseela-repo)
        env:
          RECIPES_REF: ${{ inputs.recipes_ref }}
        run: bash bootstrap/fetch-recipes.sh
      - name: Syntax check every shell script
        run: |
          for f in bootstrap/*.sh bootstrap/seed/*.sh scripts/*.sh; do
            bash -n "$f" || { echo "syntax error in $f"; exit 1; }
          done
      - name: ShellCheck (errors only)
        run: shellcheck --severity=error bootstrap/*.sh bootstrap/seed/*.sh scripts/*.sh
      - name: fetch-recipes.sh tests (local fake GitHub)
        run: bash tests/test-fetch-recipes.sh
      - name: rootfs-min closure resolves (base-devel + nawa + network tools)
        run: python3 scripts/rootfs-closure.py recipes base-devel nawa git curl ca-certificates > /dev/null
      - name: build-all.sh mock pipeline tests
        run: bash tests/test-build-all-mock.sh
      - name: build-packages-inner.sh tests (stubbed nawa)
        run: bash tests/test-build-packages-inner.sh
      - name: rootfs artifact + self-hosting seed tests
        run: bash tests/test-rootfs.sh
      - name: final-root helper tests
        run: bash tests/test-final-root.sh
      - name: rootfs-min tests (stubbed nawa)
        run: bash tests/test-mkrootfs-min.sh
      - name: qemu-boot-test.sh tests (fake qemu)
        run: bash tests/test-qemu-boot-test.sh
      - name: mkiso.sh tests (stubbed host tools)
        run: bash tests/test-mkiso.sh
      - name: skip-packages list (filter_skipped)
        run: bash tests/test-skip-packages.sh
      - name: installer validation (stubbed disks)
        run: bash tests/validate-install.sh
      - name: check-sources.py tests (local server, mirrors, retries, exit code)
        run: bash tests/test-check-sources.sh
      - name: ci-report.py tests (fixture logs and API answers)
        run: bash tests/test-ci-report.sh
      - name: build-all.sh dry run at every isolation level
        run: |
          for level in none env sandbox closure; do
            echo "::group::build-all.sh --dry-run --isolation $level"
            bash bootstrap/build-all.sh --dry-run --isolation "$level" "/tmp/mydistro-dry-$level"
            echo "::endgroup::"
          done

  # One required check for branch protection: green only if EVERY job above is.
  # Also the end-of-run report of a plain CI run. Inside release.yml (where
  # github.workflow is the CALLER's name) the release's own `run report` job
  # covers it, so no second report is written there.
  ci-ok:
    name: CI passed
    if: always()
    needs: [scripts]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: All jobs must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a CI job finished as '$r'"; exit 1; }
          done
      - uses: actions/checkout@v4
        if: ${{ always() && github.workflow == 'CI' }}
      - name: Report
        if: ${{ always() && github.workflow == 'CI' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > needs.json
          python3 scripts/ci-report.py report --needs-json needs.json --exclude "CI passed" \
            | tee run-report.md >> "$GITHUB_STEP_SUMMARY"
