# Toolchain recipe: the GNU C Library.
# Built right after linux-headers; everything else links against it.
# (LFS 12.2 chapter 6 equivalent, out-of-tree build)
[package]
name = "glibc"
version = "2.40"
rel = 1
arch = ["x86_64"]
summary = "The GNU C Library (glibc)"
license = ["LGPL-2.1"]
source = "https://mirrors.kernel.org/gnu/glibc/glibc-%{version}.tar.xz"
# canonical: https://ftp.gnu.org/gnu/glibc/
sha256 = "19a890175e9263d748f627993de6f4b1af9cd21e03f080e4bfb3a1fac10205a2"

[depends]
build = ["linux-headers"]
run = []

[build]
prepare = "mkdir -v build"
# glibc must NOT be built with _FORTIFY_SOURCE. Ubuntu's gcc (the stage-2 seed
# compiler) enables -D_FORTIFY_SOURCE=3 by default, and glibc's own
# `-Wp,-U_FORTIFY_SOURCE` does not cancel it (the driver only suppresses its
# default when it sees a plain -U). The result is
#   syslog.c: error: inlining failed in call to 'always_inline' 'syslog'
# so pass -U at driver level via CC (config.make keeps it for the compile).
configure = """
cd build && CC="gcc -U_FORTIFY_SOURCE" ../configure --prefix=/usr \
    --disable-werror                         \
    --enable-kernel=5.4                      \
    --enable-stack-protector=strong          \
    --disable-nscd                           \
    libc_cv_slibdir=/usr/lib
"""
compile = "cd build && make -j%{jobs}"
check = "cd build && make check"
install = "cd build && make DESTDIR=%{pkgdir} install"

[hooks]
# runs on the target system after install
post_install = "ldconfig"
