# Toolchain recipe: GNU multiple-precision floating-point library.
[package]
name = "mpfr"
version = "4.2.1"
rel = 1
arch = ["x86_64"]
summary = "GNU multiple-precision floating-point library"
license = ["LGPL-3.0"]
source = "https://mirrors.kernel.org/gnu/mpfr/mpfr-%{version}.tar.xz"
# canonical: https://ftp.gnu.org/gnu/mpfr/
sha256 = "277807353a6726978996945af13e52829e3abd7a9a5b7fb2793894e18f1fcbb2"

[depends]
build = ["gmp"]
run = ["gmp"]

[build]
configure = """
./configure --prefix=/usr      \
    --disable-static           \
    --enable-thread-safe
"""
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
