# gui recipe: dejavu-fonts — DejaVu TrueType font family
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
[package]
name = "dejavu-fonts"
version = "2.37"
rel = 1
arch = ["x86_64"]
summary = "DejaVu TrueType font family"
license = ["Bitstream-Vera"]
source = "https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-%{version}.tar.bz2"
sha256 = "fa9ca4d13871dd122f61258a80d01751d603b4d3ee14095d65453b4e846e17d7"
source_dir = "dejavu-fonts-ttf-%{version}"

[depends]
build = []
run = ["fontconfig"]

[build]
install = '''
install -d %{pkgdir}/usr/share/fonts/TTF
install -m644 ttf/*.ttf %{pkgdir}/usr/share/fonts/TTF/
'''

[hooks]
post_install = '''fc-cache -f 2>/dev/null || true
'''
