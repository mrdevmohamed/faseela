# gui recipe: harfbuzz — OpenType text shaping engine
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
[package]
name = "harfbuzz"
version = "10.0.1"
rel = 1
arch = ["x86_64"]
summary = "OpenType text shaping engine"
license = ["MIT"]
source = "https://github.com/harfbuzz/harfbuzz/releases/download/%{version}/harfbuzz-%{version}.tar.xz"
sha256 = "5a8e728d26aa83ebc24b6ecf4dcf6935a923aae63313a4cc3bd295bd7bb654d3"

[depends]
build = ["meson", "ninja", "pkgconf", "freetype"]
run = ["freetype"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D glib=disabled -D gobject=disabled -D icu=disabled -D cairo=disabled -D freetype=enabled -D tests=disabled -D docs=disabled -D introspection=disabled -D benchmark=disabled"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
