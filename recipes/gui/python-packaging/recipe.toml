# gui recipe: python-packaging — Core utilities for python packages (pure python)
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
[package]
name = "python-packaging"
version = "24.2"
rel = 1
arch = ["x86_64"]
summary = "Core utilities for python packages (pure python)"
license = ["Apache-2.0", "BSD-2-Clause"]
source = "https://github.com/pypa/packaging/archive/refs/tags/%{version}.tar.gz"
sha256 = "c448ea78de5134f5002a2aa2bb62a0fb4714bb4ab2d2b00bce8ed6ca22502d5a"
source_dir = "packaging-%{version}"

[depends]
build = ["python"]
run = ["python"]

[build]
install = '''
site=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
install -d "%{pkgdir}$site"
cp -r src/packaging "%{pkgdir}$site/"
find "%{pkgdir}$site/packaging" -name __pycache__ -prune -exec rm -rf {} +
'''
