# gui recipe: fribidi — Unicode bidirectional algorithm library
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
[package]
name = "fribidi"
version = "1.0.16"
rel = 1
arch = ["x86_64"]
summary = "Unicode bidirectional algorithm library"
license = ["LGPL-2.1-or-later"]
source = "https://github.com/fribidi/fribidi/releases/download/v%{version}/fribidi-%{version}.tar.xz"
sha256 = "1b1cde5b235d40479e91be2f0e88a309e3214c8ab470ec8a2744d82a5a9ea05c"

[depends]
build = ["meson", "ninja", "pkgconf"]
run = []

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D docs=false -D tests=false"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
