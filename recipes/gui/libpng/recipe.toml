# gui recipe: libpng — PNG reference library
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
[package]
name = "libpng"
version = "1.6.44"
rel = 1
arch = ["x86_64"]
summary = "PNG reference library"
license = ["libpng-2.0"]
source = "https://download.sourceforge.net/libpng/libpng-%{version}.tar.xz"
sha256 = "60c4da1d5b7f0aa8d158da48e8f8afa9773c1c8baa5d21974df61f1886b8ce8e"

[depends]
build = ["zlib"]
run = ["zlib"]

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
