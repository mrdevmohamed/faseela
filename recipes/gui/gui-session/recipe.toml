# gui recipe: gui-session — Wayland desktop session: seatd service, start-sway, default fonts/terminal
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
[package]
name = "gui-session"
version = "0.1"
rel = 3
arch = ["x86_64"]
summary = "Wayland desktop session: seatd service, start-sway, default fonts/terminal/wallpaper"
license = ["MIT"]

[depends]
build = ["shadow"]
run = ["sway", "swaybg", "foot", "seatd", "mesa", "dejavu-fonts", "eudev", "runit", "shadow"]

[build]
install = '''
# --- seatd supervised by runit (enabled by default) -------------------------
install -d -m755 %{pkgdir}/etc/sv/seatd %{pkgdir}/etc/runit/runsvdir/default
printf '#!/bin/sh\nexec seatd -g seat\n' > %{pkgdir}/etc/sv/seatd/run
chmod 755 %{pkgdir}/etc/sv/seatd/run
ln -s /etc/sv/seatd %{pkgdir}/etc/runit/runsvdir/default/seatd

# --- default wallpaper: sway's stock config has its own wallpaper line disabled;
#     this drop-in is read through its `include /etc/sway/config.d/*` -----------
install -d -m755 %{pkgdir}/usr/share/backgrounds/mydistro %{pkgdir}/etc/sway/config.d
base64 -d > %{pkgdir}/usr/share/backgrounds/mydistro/default.png <<'PNG'
