# gui recipe: pango — Text layout and rendering library
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
[package]
name = "pango"
version = "1.54.0"
rel = 1
arch = ["x86_64"]
summary = "Text layout and rendering library"
license = ["LGPL-2.1-or-later"]
source = "https://download.gnome.org/sources/pango/1.54/pango-%{version}.tar.xz"
sha256 = "8a9eed75021ee734d7fc0fdf3a65c3bba51dfefe4ae51a9b414a60c70b2d1ed8"

[depends]
build = ["meson", "ninja", "pkgconf", "glib", "harfbuzz", "fribidi", "cairo", "fontconfig", "freetype"]
run = ["glib", "harfbuzz", "fribidi", "cairo", "fontconfig", "freetype"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D introspection=disabled -D gtk_doc=false -D build-testsuite=false -D build-examples=false -D xft=disabled -D libthai=disabled -D sysprof=disabled -D cairo=enabled -D fontconfig=enabled"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
