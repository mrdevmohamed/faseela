# gui recipe: wayland-protocols — Wayland protocol extensions
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
[package]
name = "wayland-protocols"
version = "1.38"
rel = 1
arch = ["x86_64"]
summary = "Wayland protocol extensions"
license = ["MIT"]
source = "https://gitlab.freedesktop.org/wayland/wayland-protocols/-/archive/%{version}/wayland-protocols-%{version}.tar.gz"
sha256 = "a6069948458a1d86cea2b33a9735e67d7524118c32c388d75efb881a9e9d2cd9"

[depends]
build = ["meson", "ninja", "pkgconf", "wayland"]
run = ["wayland"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D tests=false"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
