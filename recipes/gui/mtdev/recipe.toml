# gui recipe: mtdev — Multitouch protocol translation library
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
[package]
name = "mtdev"
version = "1.1.6"
rel = 1
arch = ["x86_64"]
summary = "Multitouch protocol translation library"
license = ["MIT"]
source = "https://bitmath.org/code/mtdev/mtdev-%{version}.tar.bz2"
sha256 = "15d7b28da8ac71d8bc8c9287c2045fd174267bc740bec10cfda332dc1204e0e0"

[depends]
build = ["pkgconf"]
run = []

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
