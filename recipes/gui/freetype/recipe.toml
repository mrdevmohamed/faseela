# gui recipe: freetype — TrueType/OpenType font rendering library
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
[package]
name = "freetype"
version = "2.13.3"
rel = 1
arch = ["x86_64"]
summary = "TrueType/OpenType font rendering library"
license = ["FTL"]
source = "https://download.savannah.gnu.org/releases/freetype/freetype-%{version}.tar.xz"
sha256 = "0550350666d427c74daeb85d5ac7bb353acba5f76956395995311a9c6f063289"

[depends]
build = ["libpng", "zlib", "bzip2", "pkgconf"]
run = ["libpng", "zlib", "bzip2"]

[build]
configure = "./configure --prefix=/usr --disable-static --with-harfbuzz=no --with-brotli=no --with-png=yes --with-zlib=yes --with-bzip2=yes"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
