# system recipe: libxcrypt — the password-hashing library (libcrypt.so).
# glibc >= 2.38 no longer ships libcrypt; shadow's /bin/login (and anything
# else using crypt(3)) links against it. Without this package the binaries
# built against the SEED's libcrypt fail on the final root with
#   libcrypt.so.1: cannot open shared object file
# --enable-obsolete-api=glibc provides the libcrypt.so.1 ABI (glibc's old
# symbol set) next to libcrypt.so.2.
[package]
name = "libxcrypt"
version = "4.4.38"
rel = 1
arch = ["x86_64"]
summary = "Extended crypt library for password hashing (libcrypt)"
license = ["LGPL-2.1"]
source = "https://github.com/besser82/libxcrypt/releases/download/v%{version}/libxcrypt-%{version}.tar.xz"
sha256 = "80304b9c306ea799327f01d9a7549bdb28317789182631f1b54f4511b4206dd6"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr --enable-hashes=strong,glibc --enable-obsolete-api=glibc --disable-static --disable-failure-tokens"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
