# system recipe: Shadow password suite (useradd, passwd, ...)
[package]
name = "shadow"
version = "4.18.0"
rel = 2
arch = ["x86_64"]
summary = "Shadow password suite (useradd, passwd, ...)"
license = ["BSD-3-Clause"]
source = "https://github.com/shadow-maint/shadow/releases/download/4.18.0/shadow-4.18.0.tar.xz"
sha256 = "add4604d3bc410344433122a819ee4154b79dd8316a56298c60417e637c07608"

[depends]
build = ["libxcrypt"]
run = ["libxcrypt"]

[build]
configure = "./configure --sysconfdir=/etc --disable-static --without-libbsd --with-group-name-max-length=32"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
