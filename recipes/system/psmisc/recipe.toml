# system recipe: Process utilities (pstree, fuser, killall)
[package]
name = "psmisc"
version = "23.7"
rel = 1
arch = ["x86_64"]
summary = "Process utilities (pstree, fuser, killall)"
license = ["GPL-2.0"]
source = "https://deb.debian.org/debian/pool/main/p/psmisc/psmisc_23.7.orig.tar.xz"
sha256 = "58c55d9c1402474065adae669511c191de374b0871eec781239ab400b907c327"

[depends]
build = ["ncurses"]
run = ["ncurses"]

[build]
configure = "./configure --prefix=/usr"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
