# system recipe: Dynamic device-management daemon (udev fork)
[package]
name = "eudev"
version = "3.2.14"
rel = 1
arch = ["x86_64"]
summary = "Dynamic device-management daemon (udev fork)"
license = ["GPL-2.0", "LGPL-2.1"]
source = "https://github.com/eudev-project/eudev/releases/download/v3.2.14/eudev-3.2.14.tar.gz"
sha256 = "8da4319102f24abbf7fff5ce9c416af848df163b29590e666d334cc1927f006f"

[depends]
build = ["e2fsprogs", "gperf", "pkgconf"]
run = ["e2fsprogs", "gperf", "pkgconf"]

[build]
configure = "./configure --prefix=/usr --with-rootprefix=/usr --sysconfdir=/etc --sbindir=/usr/bin --libdir=/usr/lib --with-rootlibdir=/usr/lib --disable-manpages --disable-static --disable-gtk-doc"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
