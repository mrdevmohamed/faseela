# system recipe: Network routing/control utilities (ip, ss, tc)
[package]
name = "iproute2"
version = "7.3.0"
rel = 1
arch = ["x86_64"]
summary = "Network routing/control utilities (ip, ss, tc)"
license = ["GPL-2.0"]
source = "https://cdn.kernel.org/pub/linux/utils/net/iproute2/iproute2-7.3.0.tar.xz"
sha256 = "5c1789d290bba048a6135ed1ab81b0402dd0fb528d1f1421765c42b1fc3d6289"

[depends]
build = ["libmnl"]
run = ["libmnl"]

[build]
prepare = "./configure"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} SBINDIR=/usr/sbin install"
