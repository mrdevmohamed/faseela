# system recipe: Minimalistic netlink library
[package]
name = "libmnl"
version = "1.0.5"
rel = 1
arch = ["x86_64"]
summary = "Minimalistic netlink library"
license = ["LGPL-2.1"]
source = "https://netfilter.org/projects/libmnl/files/libmnl-1.0.5.tar.bz2"
sha256 = "274b9b919ef3152bfb3da3a13c950dd60d6e2bcd54230ffeca298d03b40d0525"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
