# system recipe: Command-line tool and library for transferring data with URLs
[package]
name = "curl"
version = "8.16.0"
rel = 1
arch = ["x86_64"]
summary = "Command-line tool and library for transferring data with URLs"
license = ["curl"]
source = "https://curl.se/download/curl-8.16.0.tar.xz"
sha256 = "40c8cddbcb6cc6251c03dea423a472a6cea4037be654ba5cf5dec6eb2d22ff1d"

[depends]
build = ["libidn2", "libpsl", "openssl", "pkgconf", "zlib"]
run = ["libidn2", "libpsl", "openssl", "pkgconf", "zlib"]

[build]
configure = "./configure --prefix=/usr --disable-static --with-openssl --with-libpsl --with-libidn2 --with-zlib --without-librtmp --disable-ldap --disable-ldaps --with-ca-bundle=/etc/ssl/certs/ca-certificates.crt"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
