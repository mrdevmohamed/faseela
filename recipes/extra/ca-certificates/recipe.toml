# # Mozilla CA bundle, single-file source (pinned dated snapshot from curl.se)
# extra recipe: ca-certificates — Mozilla root certificate authorities bundle
[package]
name = "ca-certificates"
version = "2025-02-25"
rel = 1
arch = ["x86_64"]
summary = "ca-certificates — Mozilla root certificate authorities bundle"
license = ["MPL-2.0"]
source = "https://curl.se/ca/cacert-2025-02-25.pem"
sha256 = "50a6277ec69113f00c5fd45f09e8b97a4b3e32daa35d3a95ab30137a55386cef"

[depends]
build = []
run = ["openssl"]

[build]
install = """

install -Dm644 cacert-2025-02-25.pem %{pkgdir}/etc/ssl/certs/ca-certificates.crt
ln -sf certs/ca-certificates.crt %{pkgdir}/etc/ssl/cert.pem

"""
