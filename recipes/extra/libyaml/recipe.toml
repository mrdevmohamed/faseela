# # upstream tarball directory is yaml-0.2.5
# extra recipe: libyaml — YAML 1.1 parser and emitter library
[package]
name = "libyaml"
version = "0.2.5"
rel = 1
arch = ["x86_64"]
summary = "libyaml — YAML 1.1 parser and emitter library"
license = ["MIT"]
source = "https://pyyaml.org/download/libyaml/yaml-%{version}.tar.gz"
sha256 = "c642ae9b75fee120b2d96c712538bd2cf283228d2337df2cf2988e3c02678ef4"
source_dir = "yaml-%{version}"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
