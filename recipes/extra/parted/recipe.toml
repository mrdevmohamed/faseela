# extra recipe: GNU parted — disk partition table manipulator
[package]
name = "parted"
version = "3.6"
rel = 1
arch = ["x86_64"]
summary = "GNU parted — disk partition table manipulator"
license = ["GPL-3.0-or-later"]
source = "https://mirrors.kernel.org/gnu/parted/parted-%{version}.tar.xz"
sha256 = "3b43dbe33cca0f9a18601ebab56b7852b128ec1a3df3a9b30ccde5e73359e612"

[depends]
build = ["util-linux", "readline"]
run = ["util-linux", "readline"]

[build]
configure = "./configure --prefix=/usr --disable-static --disable-device-mapper"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
