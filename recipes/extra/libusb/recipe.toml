# extra recipe: libusb — userspace USB library
[package]
name = "libusb"
version = "1.0.27"
rel = 1
arch = ["x86_64"]
summary = "libusb — userspace USB library"
license = ["LGPL-2.1-or-later"]
source = "https://github.com/libusb/libusb/releases/download/v%{version}/libusb-%{version}.tar.bz2"
sha256 = "ffaa41d741a8a3bee244ac8e54a72ea05bf2879663c098c82fc5757853441575"

[depends]
build = ["eudev"]
run = ["eudev"]

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
