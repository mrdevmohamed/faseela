# # `all2` builds bin/7z (EXTERNAL_CODECS) but NOT 7za/7zr on 17.05, so build them explicitly
# extra recipe: p7zip — command line version of 7-Zip for POSIX
[package]
name = "p7zip"
version = "17.05"
rel = 2
arch = ["x86_64"]
summary = "p7zip — command line version of 7-Zip for POSIX"
license = ["LGPL-2.1-or-later", "BSD-3-Clause"]
source = "https://github.com/p7zip-project/p7zip/archive/refs/tags/v%{version}.tar.gz"
sha256 = "d2788f892571058c08d27095c22154579dfefb807ebe357d145ab2ddddefb1a6"

[depends]
build = []
run = []

[build]
compile = "make -j%{jobs} 7za && make -j%{jobs} 7zr"
install = """

install -d %{pkgdir}/usr/bin %{pkgdir}/usr/share/man/man1
install -m755 bin/7za bin/7zr %{pkgdir}/usr/bin/
install -m644 man1/7z.1 man1/7za.1 man1/7zr.1 %{pkgdir}/usr/share/man/man1/

"""
