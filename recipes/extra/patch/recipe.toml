# extra recipe: GNU patch — apply diffs to files
[package]
name = "patch"
version = "2.7.6"
rel = 1
arch = ["x86_64"]
summary = "GNU patch — apply diffs to files"
license = ["GPL-3.0-or-later"]
source = "https://mirrors.kernel.org/gnu/patch/patch-%{version}.tar.xz"
sha256 = "ac610bda97abe0d9f6b7c963255a11dcb196c25e337c61f94e4778d632f1d8fd"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
