# extra recipe: logrotate — rotates, compresses and mails system logs
[package]
name = "logrotate"
version = "3.22.0"
rel = 1
arch = ["x86_64"]
summary = "logrotate — rotates, compresses and mails system logs"
license = ["GPL-2.0-or-later"]
source = "https://github.com/logrotate/logrotate/releases/download/%{version}/logrotate-%{version}.tar.xz"
sha256 = "42b4080ee99c9fb6a7d12d8e787637d057a635194e25971997eebbe8d5e57618"

[depends]
build = ["popt"]
run = ["popt"]

[build]
configure = "./configure --prefix=/usr --sysconfdir=/etc"
compile = "make -j%{jobs}"
install = """

make DESTDIR=%{pkgdir} install
install -d %{pkgdir}/etc/logrotate.d %{pkgdir}/var/lib/logrotate
cat > %{pkgdir}/etc/logrotate.conf <<'EOF'
weekly
rotate 4
create
include /etc/logrotate.d
EOF

"""
