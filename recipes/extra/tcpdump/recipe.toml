# extra recipe: tcpdump — dump traffic on a network
[package]
name = "tcpdump"
version = "4.99.5"
rel = 1
arch = ["x86_64"]
summary = "tcpdump — dump traffic on a network"
license = ["BSD-3-Clause"]
source = "https://www.tcpdump.org/release/tcpdump-%{version}.tar.gz"
sha256 = "8c75856e00addeeadf70dad67c9ff3dd368536b2b8563abf6854d7c764cd3adb"

[depends]
build = ["libpcap", "openssl"]
run = ["libpcap", "openssl"]

[build]
configure = "./configure --prefix=/usr"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
