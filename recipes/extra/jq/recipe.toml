# extra recipe: jq — lightweight and flexible command-line JSON processor
[package]
name = "jq"
version = "1.7.1"
rel = 3
arch = ["x86_64"]
summary = "jq — lightweight and flexible command-line JSON processor"
license = ["MIT"]
source = "https://github.com/jqlang/jq/releases/download/jq-%{version}/jq-%{version}.tar.gz"
sha256 = "478c9ca129fd2e3443fe27314b455e211e0d8c60bc8ff7df703873deeee580c2"

[depends]
build = []
run = []

[build]
# `--with-oniguruma=builtin` builds oniguruma inside the jq tree. As a shared
# build, libjq.so.1 got a NEEDED libonig.so.5 that points at the build tree
# and is never installed, so the final-root check (stage3 self-host) failed:
# "usr/lib/libjq.so.1.0.4 needs libonig.so.5, which is not in the root".
# Static only: jq (and libjq.a) carry the regex engine themselves, nothing
# shared is left to resolve at run time.
configure = "./configure --prefix=/usr --with-oniguruma=builtin --disable-docs --disable-shared --enable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
