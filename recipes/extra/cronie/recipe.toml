# extra recipe: cronie — standard UNIX cron daemon (Vixie fork)
[package]
name = "cronie"
version = "1.7.2"
rel = 1
arch = ["x86_64"]
summary = "cronie — standard UNIX cron daemon (Vixie fork)"
license = ["GPL-2.0-or-later"]
source = "https://github.com/cronie-crond/cronie/releases/download/cronie-%{version}/cronie-%{version}.tar.gz"
sha256 = "f1da374a15ba7605cf378347f96bc8b678d3d7c0765269c8242cfe5b0789c571"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --without-selinux"
compile = "make -j%{jobs}"
install = """

make DESTDIR=%{pkgdir} install
install -d %{pkgdir}/var/spool/cron

"""
