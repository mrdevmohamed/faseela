# extra recipe: iptables — administration tool for IPv4/IPv6 packet filtering and NAT
[package]
name = "iptables"
version = "1.8.11"
rel = 1
arch = ["x86_64"]
summary = "iptables — administration tool for IPv4/IPv6 packet filtering and NAT"
license = ["GPL-2.0-or-later"]
source = "https://netfilter.org/projects/iptables/files/iptables-%{version}.tar.xz"
sha256 = "d87303d55ef8c92bcad4dd3f978b26d272013642b029425775f5bad1009fe7b2"

[depends]
build = ["libmnl", "libnftnl"]
run = ["libmnl", "libnftnl"]

[build]
configure = "./configure --prefix=/usr --sysconfdir=/etc"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
