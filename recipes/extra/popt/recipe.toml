# # Debian .orig (+dfsg) tarball; directory inside is plain popt-1.19
# extra recipe: popt — command-line option parsing library
[package]
name = "popt"
version = "1.19"
rel = 1
arch = ["x86_64"]
summary = "popt — command-line option parsing library"
license = ["MIT"]
source = "https://deb.debian.org/debian/pool/main/p/popt/popt_1.19+dfsg.orig.tar.xz"
sha256 = "4cd0cd2963d0c4078f65949599d97135c15ee6c09cf3a36a9a1b2753025bb06b"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
