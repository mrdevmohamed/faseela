# extra recipe: libnftnl — netlink library for nftables
[package]
name = "libnftnl"
version = "1.2.8"
rel = 1
arch = ["x86_64"]
summary = "libnftnl — netlink library for nftables"
license = ["GPL-2.0-or-later"]
source = "https://netfilter.org/projects/libnftnl/files/libnftnl-%{version}.tar.xz"
sha256 = "37fea5d6b5c9b08de7920d298de3cdc942e7ae64b1a3e8b880b2d390ae67ad95"

[depends]
build = ["libmnl"]
run = ["libmnl"]

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
