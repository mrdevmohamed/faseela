# extra recipe: Vim — Vi IMproved, a programmer's text editor
[package]
name = "vim"
version = "9.1.1045"
rel = 1
arch = ["x86_64"]
summary = "Vim — Vi IMproved, a programmer's text editor"
license = ["Vim"]
source = "https://github.com/vim/vim/archive/refs/tags/v%{version}.tar.gz"
sha256 = "741fcd999bdcecb544fc231adc57bfdde426a008fce1e2586eb0b6be585ebee3"

[depends]
build = ["ncurses"]
run = ["ncurses"]

[build]
configure = "./configure --prefix=/usr --with-features=huge --with-x=no --disable-gui"
compile = "make -j%{jobs}"
install = """

make DESTDIR=%{pkgdir} install
ln -sf vim %{pkgdir}/usr/bin/vi

"""
