# # Info-ZIP unzip — Debian .orig tarball (sourceforge unreachable)
# extra recipe: Info-ZIP unzip — extractor for PKZIP archives
[package]
name = "unzip"
version = "6.0"
rel = 1
arch = ["x86_64"]
summary = "Info-ZIP unzip — extractor for PKZIP archives"
license = ["Info-ZIP"]
source = "https://deb.debian.org/debian/pool/main/u/unzip/unzip_6.0.orig.tar.gz"
sha256 = "036d96991646d0449ed0aa952e4fbe21b476ce994abc276e49d30e686708bd37"
source_dir = "unzip60"

[depends]
build = ["bzip2"]
run = []

[build]
compile = "make -f unix/Makefile -j%{jobs} generic"
install = "make -f unix/Makefile prefix=%{pkgdir}/usr MANDIR=%{pkgdir}/usr/share/man/man1 install"
