# extra recipe: rsync — fast incremental file transfer
[package]
name = "rsync"
version = "3.4.1"
rel = 1
arch = ["x86_64"]
summary = "rsync — fast incremental file transfer"
license = ["GPL-3.0-or-later"]
source = "https://download.samba.org/pub/rsync/src/rsync-%{version}.tar.gz"
sha256 = "2924bcb3a1ed8b551fc101f740b9f0fe0a202b115027647cf69850d65fd88c52"

[depends]
build = ["zstd", "lz4", "openssl", "zlib"]
run = ["zstd", "lz4", "openssl"]

[build]
configure = "./configure --prefix=/usr --without-included-zlib --disable-xxhash"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
