# base recipe: GNU Unicode string library
[package]
name = "libunistring"
version = "1.5"
rel = 1
arch = ["x86_64"]
summary = "GNU Unicode string library"
license = ["LGPL-3.0", "GPL-2.0"]
source = "https://mirrors.kernel.org/gnu/libunistring/libunistring-1.5.tar.xz"
sha256 = "fe89007a8a414ae4790b816b86859e877d3ab135db3c37f06541ff7e85ac344b"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
