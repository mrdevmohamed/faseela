# base recipe: GNU pattern matcher (grep)
[package]
name = "grep"
version = "3.12"
rel = 1
arch = ["x86_64"]
summary = "GNU pattern matcher (grep)"
license = ["GPL-3.0"]
source = "https://mirrors.kernel.org/gnu/grep/grep-3.12.tar.xz"
sha256 = "2649b27c0e90e632eadcd757be06c6e9a4f48d941de51e7c0f83ff76408a07b9"

[depends]
build = ["pcre2"]
run = ["pcre2"]

[build]
configure = "./configure --prefix=/usr"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
