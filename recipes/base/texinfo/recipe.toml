# base recipe: GNU documentation system (info pages)
[package]
name = "texinfo"
version = "7.3"
rel = 1
arch = ["x86_64"]
summary = "GNU documentation system (info pages)"
license = ["GPL-3.0"]
source = "https://mirrors.kernel.org/gnu/texinfo/texinfo-7.3.tar.xz"
sha256 = "51f74eb0f51cfa9873b85264dfdd5d46e8957ec95b88f0fb762f63d9e164c72e"

[depends]
build = ["perl"]
run = []

[build]
configure = "./configure --prefix=/usr"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
