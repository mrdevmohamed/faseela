# base recipe: Perl-compatible regular expression library (edition 2)
[package]
name = "pcre2"
version = "10.46"
rel = 1
arch = ["x86_64"]
summary = "Perl-compatible regular expression library (edition 2)"
license = ["BSD-3-Clause"]
source = "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.46/pcre2-10.46.tar.bz2"
sha256 = "15fbc5aba6beee0b17aecb04602ae39432393aba1ebd8e39b7cabf7db883299f"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr --enable-pcre2-16 --enable-pcre2-32 --enable-jit --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
