# base recipe: GNU stream editor (sed)
[package]
name = "sed"
version = "4.10"
rel = 1
arch = ["x86_64"]
summary = "GNU stream editor (sed)"
license = ["GPL-3.0"]
source = "https://mirrors.kernel.org/gnu/sed/sed-4.10.tar.xz"
sha256 = "b8e72182b2ec96a3574e2998c47b7aaa64cc20ce000d8e9ac313cc07cecf28c7"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
