# base recipe: TLS/SSL and general-purpose cryptography library
[package]
name = "openssl"
version = "3.5.7"
rel = 1
arch = ["x86_64"]
summary = "TLS/SSL and general-purpose cryptography library"
license = ["Apache-2.0"]
source = "https://www.openssl.org/source/openssl-3.5.7.tar.gz"
sha256 = "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8"

[depends]
build = ["zlib"]
run = ["zlib"]

[build]
configure = "./config --prefix=/usr --openssldir=/etc/ssl --libdir=lib shared zlib-dynamic"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} MANSUFFIX=ssl install"
