# base recipe: Stream-oriented XML parser library
[package]
name = "expat"
version = "2.7.3"
rel = 1
arch = ["x86_64"]
summary = "Stream-oriented XML parser library"
license = ["MIT"]
source = "https://github.com/libexpat/libexpat/releases/download/R_2_7_3/expat-2.7.3.tar.xz"
sha256 = "71df8f40706a7bb0a80a5367079ea75d91da4f8c65c58ec59bcdfbf7decdab9f"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr --disable-static --without-docbook"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
