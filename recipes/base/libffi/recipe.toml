# base recipe: Portable foreign-function-interface library
[package]
name = "libffi"
version = "3.5.2"
rel = 2
arch = ["x86_64"]
summary = "Portable foreign-function-interface library"
license = ["MIT"]
source = "https://github.com/libffi/libffi/releases/download/v3.5.2/libffi-3.5.2.tar.gz"
sha256 = "f3a3082a23b37c293a4fcd1053147b371f2ff91fa7ea1b2a52e335676bac82dc"

[depends]
build = []
run = []

[build]
# libffi defaults to libdir=/usr/lib/../lib64 on x86_64, but this distro's
# loader path (ld.so.conf) only lists /usr/lib, so python's _ctypes could not
# load libffi.so.8. Keep it in /usr/lib like every other recipe.
configure = "./configure --prefix=/usr --libdir=/usr/lib --disable-static --with-gcc-arch=x86-64"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
