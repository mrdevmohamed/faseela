# base recipe: DPM — this distribution's source-based package manager (self-hosting build)
#
# Built with the distro's own `rust` recipe (cargo on the sandbox PATH).
# No network: the crates are vendored in pkgmgr/vendor (+ .cargo/config.toml),
# generated by scripts/vendor-dpm.sh and committed with the source.
[package]
name = "dpm"
version = "0.8.0"
rel = 1
arch = ["x86_64"]
summary = "DPM — this distribution's source-based package manager (self-hosting build)"
license = ["GPL-3.0"]
source = "local:pkgmgr"

[depends]
build = ["rust"]
run = []

[build]
# local: sources are copied verbatim — drop any host-built target/ so we never package stale artifacts
prepare = "rm -rf target"
compile = "cargo build --release --offline --locked"
install = "install -Dm755 target/release/dpm %{pkgdir}/usr/bin/dpm"
