# base recipe: nawa-recipes — the recipe tree, installed system-wide
#
# Downloads the official repository (github.com/mrdevmohamed/faseela) at ONE
# pinned commit and installs its recipes/ directory to /usr/share/nawa/recipes,
# the path /etc/nawa/nawa.toml points `recipes` at. With it `nawa install <name>`
# resolves dependencies and builds from source on any machine, from any
# directory, with no checkout and no dependency on how the CI lays out files.
#
# The commit, `version` (its date), `rel` and `sha256` are written by
#   python3 scripts/pin-recipes-source.py [<commit>]
# Run it after the commit you want to ship is pushed. A commit cannot contain
# the hash of its own tarball, so the shipped tree is the one AT the pinned
# commit — normally one commit behind this file. That is intended.
[package]
name = "nawa-recipes"
version = "2026.10.30"
rel = 9
arch = ["x86_64"]
summary = "nawa-recipes — the distribution's recipe tree for nawa"
license = ["MIT"]
source = "https://github.com/mrdevmohamed/faseela/archive/16fbe42d940a55b21d15ff03406b359af0e1bbcc.tar.gz"
sha256 = "471114fdd9e7d7abc31f254d43161d3404094b51455c9c59b1e56691c7f83a67"
source_dir = "faseela-16fbe42d940a55b21d15ff03406b359af0e1bbcc"

[depends]
build = []
run = ["nawa"]

[build]
install = """
install -d -m755 %{pkgdir}/usr/share/nawa/recipes
cp -a recipes/. %{pkgdir}/usr/share/nawa/recipes/
# the tree is data: nothing executable, nothing group/world writable
find %{pkgdir}/usr/share/nawa/recipes -type f -exec chmod 644 {} +
find %{pkgdir}/usr/share/nawa/recipes -type d -exec chmod 755 {} +
"""
