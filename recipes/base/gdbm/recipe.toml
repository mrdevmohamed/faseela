# base recipe: GNU database manager (dbm/hash-style key-value store)
[package]
name = "gdbm"
version = "1.26"
rel = 1
arch = ["x86_64"]
summary = "GNU database manager (dbm/hash-style key-value store)"
license = ["GPL-3.0"]
source = "https://mirrors.kernel.org/gnu/gdbm/gdbm-1.26.tar.gz"
sha256 = "6a24504a14de4a744103dcb936be976df6fbe88ccff26065e54c1c47946f4a5e"

[depends]
build = ["readline"]
run = ["readline"]

[build]
configure = "./configure --prefix=/usr --disable-static --enable-libgdbm-compat"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
