# base recipe: GNU internationalization library and tools
[package]
name = "gettext"
version = "0.26"
rel = 1
arch = ["x86_64"]
summary = "GNU internationalization library and tools"
license = ["GPL-3.0", "LGPL-2.1"]
source = "https://mirrors.kernel.org/gnu/gettext/gettext-0.26.tar.xz"
sha256 = "d1fb86e260cfe7da6031f94d2e44c0da55903dbae0a2fa0fae78c91ae1b56f00"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
