# base recipe: High-quality block-sorting file compressor
[package]
name = "bzip2"
version = "1.0.8"
rel = 1
arch = ["x86_64"]
summary = "High-quality block-sorting file compressor"
license = ["bzip2-1.0.6"]
source = "https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz"
sha256 = "ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269"

[depends]
build = []
run = []

[build]
compile = """
make -f Makefile-libbz2_so
make clean
make
"""
install = """
make PREFIX=%{pkgdir}/usr install
cp -av libbz2.so.* %{pkgdir}/usr/lib
ln -sf libbz2.so.1.0.8 %{pkgdir}/usr/lib/libbz2.so
cp -v bzip2-shared %{pkgdir}/usr/bin/bzip2
ln -sf bzip2 %{pkgdir}/usr/bin/bzcat
ln -sf bzip2 %{pkgdir}/usr/bin/bunzip2
test -d %{pkgdir}/usr/man && mv %{pkgdir}/usr/man %{pkgdir}/usr/share/man || true
"""
