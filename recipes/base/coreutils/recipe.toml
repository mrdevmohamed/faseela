# base recipe: GNU core utilities (ls, cp, cat, ...)
[package]
name = "coreutils"
version = "9.12"
rel = 2
arch = ["x86_64"]
summary = "GNU core utilities (ls, cp, cat, ...)"
license = ["GPL-3.0"]
source = "https://mirrors.kernel.org/gnu/coreutils/coreutils-9.12.tar.xz"
sha256 = "a480198559733e9b3da999e90543ac6f888a2caa544d8d664c5a1f17e528e210"

[depends]
build = []
run = []

[build]
configure = "FORCE_UNSAFE_CONFIGURE=1 ./configure --prefix=/usr --enable-install-program=hostname --enable-no-install-program=kill,uptime"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
