# base recipe: XZ-format compression library and tools
[package]
name = "xz"
version = "5.8.1"
rel = 1
arch = ["x86_64"]
summary = "XZ-format compression library and tools"
license = ["GPL-2.0", "LGPL-2.1", "0BSD"]
source = "https://github.com/tukaani-project/xz/releases/download/v5.8.1/xz-5.8.1.tar.xz"
sha256 = "0b54f79df85912504de0b14aec7971e3f964491af1812d83447005807513cd9e"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr --disable-static --docdir=/usr/share/doc/xz-%{version}"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
