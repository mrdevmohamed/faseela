# base recipe: GNU awk text-processing language
[package]
name = "gawk"
version = "5.4.1"
rel = 1
arch = ["x86_64"]
summary = "GNU awk text-processing language"
license = ["GPL-3.0"]
source = "https://mirrors.kernel.org/gnu/gawk/gawk-5.4.1.tar.xz"
sha256 = "07f6f7342b7febe4313fc2c2542ad93d64fe20ad8717200109f105a826f5fd37"

[depends]
build = ["readline"]
run = ["readline"]

[build]
configure = "./configure --prefix=/usr"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
