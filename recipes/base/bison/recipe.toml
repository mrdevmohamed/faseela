# base recipe: GNU parser generator (yacc-compatible)
[package]
name = "bison"
version = "3.8.2"
rel = 1
arch = ["x86_64"]
summary = "GNU parser generator (yacc-compatible)"
license = ["GPL-3.0"]
source = "https://mirrors.kernel.org/gnu/bison/bison-3.8.2.tar.xz"
sha256 = "9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2"

[depends]
build = ["m4"]
run = []

[build]
configure = "./configure --prefix=/usr"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
