# base recipe: nawa-repo — trust for the distribution's binary repository
#
# Installs the public key that signs the package repository
# (https://github.com/mrdevmohamed/faseela-repo, release `stable`) into nawa's
# trust store, /etc/nawa/trusted-keys/. The repository URL itself comes from
# /etc/nawa/nawa.toml (package nawa). With this package installed,
# `nawa install <name>` verifies index.toml and every archive against the key
# and no longer needs --allow-unsigned.
#
# The key is taken from the official repository, dist/nawa.pub, at the
# same pinned commit as nawa-recipes (see scripts/pin-recipes-source.py).
# One-time setup: commit the PUBLIC half of the CI signing key (secret
# NAWA_SIGN_KEY_B64) as dist/nawa.pub - it is public, it is meant to be
# committed. The build fails with a clear message while that file is missing.
[package]
name = "nawa-repo"
version = "2026.10.30"
rel = 9
arch = ["x86_64"]
summary = "nawa-repo — public key of the distribution's package repository"
license = ["MIT"]
source = "https://github.com/mrdevmohamed/faseela/archive/16fbe42d940a55b21d15ff03406b359af0e1bbcc.tar.gz"
sha256 = "471114fdd9e7d7abc31f254d43161d3404094b51455c9c59b1e56691c7f83a67"
source_dir = "faseela-16fbe42d940a55b21d15ff03406b359af0e1bbcc"

[depends]
build = []
run = ["nawa"]

[build]
install = """
test -s dist/nawa.pub || { echo "nawa-repo: dist/nawa.pub is missing in the pinned commit - commit the public signing key first" >&2; exit 1; }
install -Dm644 dist/nawa.pub %{pkgdir}/etc/nawa/trusted-keys/nawa.pub
"""
