[package]
name = "dpm"
version = "0.7.0"
edition = "2021"
rust-version = "1.77"
description = "DPM — source-based package manager for a from-scratch Linux distribution"
license = "GPL-3.0"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
tar = "0.4"
zstd = "0.13"
walkdir = "2.5"
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
# already in Cargo.lock via transitive deps (filetime etc.), so the offline
# vendored bootstrap of `dpm` keeps working unchanged
libc = "0.2"

[[bin]]
name = "dpm"
path = "src/main.rs"
